<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gold Vol2Vol Dashboard — OI & Intraday Volume</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            /* Backgrounds — deep blue-charcoal (TradingView-inspired) */
            --bg-primary: #131722;
            --bg-secondary: #1c2030;
            --bg-panel: #1e2235;
            --bg-card: #252a3a;
            --border: #2a2e3e;
            --border-active: #3d4258;
            /* Text */
            --text-primary: #d1d4dc;
            --text-secondary: #9598a1;
            --text-muted: #6a6d78;
            /* Accent — electric blue */
            --accent: #2962ff;
            --accent-glow: rgba(41, 98, 255, 0.3);
            /* Status */
            --green: #26a69a;
            --red: #ef5350;
            --orange: #ff9800;
            --orange-dim: rgba(255, 152, 0, 0.1);
            --cyan: #42a5f5;
            --pink: #ab47bc;
            /* Call = Cyan, Put = Orange (original bar colors) */
            --call-color: #4dd0e1;
            --call-bg: rgba(77, 208, 225, 0.12);
            --put-color: #ffb74d;
            --put-bg: rgba(255, 183, 77, 0.12);
        }

        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ===== HEADER ===== */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 24px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            z-index: 100;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .logo {
            font-size: 20px;
            font-weight: 900;
            background: linear-gradient(135deg, var(--accent), #5b8bf5);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .contract-info {
            display: flex;
            align-items: center;
            gap: 14px;
            font-size: 13px;
        }

        .contract-name {
            color: var(--text-primary);
            font-weight: 700;
            font-size: 16px;
        }

        .contract-detail {
            color: var(--text-secondary);
            font-size: 12px;
        }

        .price-display {
            font-size: 22px;
            font-weight: 800;
            color: var(--text-primary);
            text-shadow: none;
        }

        .price-change {
            font-size: 13px;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 6px;
        }

        .price-change.up {
            color: var(--green);
            background: rgba(38, 166, 154, 0.15);
        }

        .price-change.down {
            color: var(--red);
            background: rgba(239, 83, 80, 0.15);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .dte-badge {
            background: rgba(41, 98, 255, 0.12);
            border: 1px solid rgba(41, 98, 255, 0.3);
            color: var(--accent);
            padding: 4px 12px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 13px;
        }

        .refresh-btn {
            background: rgba(41, 98, 255, 0.12);
            border: 1px solid rgba(41, 98, 255, 0.3);
            color: var(--accent);
            padding: 7px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s;
        }

        .refresh-btn:hover {
            background: rgba(41, 98, 255, 0.3);
            border-color: var(--accent);
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--green);
            box-shadow: 0 0 8px rgba(38, 166, 154, 0.5);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.4;
            }
        }

        .last-update {
            font-size: 11px;
            color: var(--text-muted);
        }

        /* ===== TABS ===== */
        .tab-bar {
            display: flex;
            gap: 0;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            padding: 0 24px;
            flex-shrink: 0;
        }

        .tab-btn {
            padding: 10px 22px;
            font-size: 12px;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
            color: var(--text-muted);
            background: none;
            border: none;
            border-bottom: 2px solid transparent;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .tab-btn:hover {
            color: var(--text-secondary);
            background: rgba(255, 255, 255, 0.02);
        }

        .tab-btn.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
        }

        .tab-btn .tab-dte {
            font-size: 10px;
            font-weight: 500;
            color: var(--text-muted);
            margin-left: 6px;
        }

        .tab-btn.active .tab-dte {
            color: var(--accent);
            opacity: 0.7;
        }

        .tab-btn .tab-contract {
            font-size: 11px;
            font-weight: 800;
            color: var(--text-primary);
            margin-left: 6px;
        }

        .tab-btn.active .tab-contract {
            color: var(--accent);
        }

        /* ===== SUMMARY STRIP ===== */
        .summary-strip {
            display: flex;
            gap: 0;
            background: var(--bg-panel);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            overflow-x: auto;
        }

        .summary-card {
            flex: 1;
            min-width: 140px;
            padding: 12px 18px;
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .summary-card:last-child {
            border-right: none;
        }

        .summary-label {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 2px;
        }

        .summary-value {
            font-size: 16px;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
        }

        .summary-sub {
            font-size: 11px;
            color: var(--text-muted);
            font-variant-numeric: tabular-nums;
        }

        .val-gold {
            color: var(--accent);
        }

        .val-cyan {
            color: var(--cyan);
        }

        .val-pink {
            color: var(--pink);
        }

        .val-green {
            color: var(--green);
        }

        .val-orange {
            color: var(--orange);
        }

        /* ===== MAIN 2-COLUMN ===== */
        .main-container {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            min-height: 0;
            overflow: hidden;
            background: var(--bg-primary);
        }

        /* ===== CHART CONTAINER ===== */
        .chart-container {
            flex: 1;
            display: none;
            /* hidden by default */
            min-height: 0;
            background: var(--bg-primary);
        }

        .chart-container.active {
            display: block;
        }

        /* Utility class to hide main container when chart is active */
        .hide-main {
            display: none !important;
        }

        /* ===== PANEL ===== */
        .data-panel {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .data-panel:first-child {
            border-right: 1px solid var(--border);
        }

        .panel-header {
            padding: 10px 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-secondary);
        }

        .panel-title {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .panel-legend {
            display: flex;
            gap: 12px;
            font-size: 10px;
            font-weight: 600;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .legend-dot {
            width: 8px;
            height: 8px;
            border-radius: 2px;
        }

        .legend-dot.call {
            background: var(--call-color);
        }

        .legend-dot.put {
            background: var(--put-color);
        }

        .legend-call {
            color: var(--call-color);
        }

        .legend-put {
            color: var(--put-color);
        }

        .data-rows {
            flex: 1;
            overflow-y: auto;
            padding: 2px 0;
        }

        .data-rows::-webkit-scrollbar {
            width: 4px;
        }

        .data-rows::-webkit-scrollbar-track {
            background: transparent;
        }

        .data-rows::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 2px;
        }

        /* ===== GRID HEADER ===== */
        .grid-header {
            display: grid;
            grid-template-columns: 32px 50px 1fr 52px 1fr 50px 32px 44px;
            align-items: center;
            padding: 4px 10px;
            font-size: 9px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.02);
        }

        .grid-header span {
            text-align: center;
        }

        .grid-header .h-call {
            color: var(--call-color);
        }

        .grid-header .h-put {
            color: var(--put-color);
        }

        .grid-header .h-right {
            text-align: right;
        }

        .grid-header .h-left {
            text-align: left;
        }

        /* ===== ROW GRID ===== */
        .row {
            display: grid;
            grid-template-columns: 32px 50px 1fr 52px 1fr 50px 32px 44px;
            align-items: center;
            padding: 0 10px;
            height: 26px;
            font-size: 11px;
            cursor: default;
            border-left: 3px solid transparent;
            border-bottom: 1px solid rgba(255, 255, 255, 0.02);
            transition: background 0.15s ease;
        }

        .row:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .row.atm {
            background: rgba(41, 98, 255, 0.08);
            border-left-color: var(--accent);
        }

        .row.hot {
            background: var(--orange-dim);
            border-left-color: var(--orange);
        }

        /* Call Delta (col 1) */
        .row-delta-call {
            text-align: center;
            font-size: 9px;
            color: var(--call-color);
            opacity: 0.7;
            font-variant-numeric: tabular-nums;
        }

        /* Call OI (col 2) */
        .row-call {
            text-align: right;
            color: var(--call-color);
            font-variant-numeric: tabular-nums;
            font-weight: 600;
            padding-right: 6px;
            border-radius: 3px;
        }

        .row-call.max-call {
            background: rgba(77, 208, 225, 0.25);
            color: #ffffff;
            font-weight: 800;
            box-shadow: 0 0 8px rgba(77, 208, 225, 0.4);
        }

        /* Call Bar (col 3) — bar grows from right to left */
        .row-bar-call {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            height: 16px;
        }

        /* Strike (col 4) */
        .row-strike {
            text-align: center;
            color: var(--text-muted);
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }

        .row-strike.hot {
            color: var(--text-secondary);
            font-weight: 800;
        }

        .row-strike.atm {
            color: var(--accent);
            font-weight: 800;
            font-size: 12px;
        }

        /* Put Bar (col 5) — bar grows from left to right */
        .row-bar-put {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            height: 16px;
        }

        /* Put OI (col 6) */
        .row-put {
            text-align: left;
            color: var(--put-color);
            font-variant-numeric: tabular-nums;
            font-weight: 600;
            padding-left: 6px;
            border-radius: 3px;
        }

        .row-put.max-put {
            background: rgba(255, 183, 77, 0.25);
            color: #ffffff;
            font-weight: 800;
            box-shadow: 0 0 8px rgba(255, 183, 77, 0.4);
        }

        /* Put Delta (col 7) */
        .row-delta-put {
            text-align: center;
            font-size: 9px;
            color: var(--put-color);
            opacity: 0.7;
            font-variant-numeric: tabular-nums;
        }

        /* Total (col 8) */
        .row-total {
            text-align: right;
            font-size: 10px;
            color: var(--text-muted);
            font-variant-numeric: tabular-nums;
            font-weight: 500;
        }

        .row-total.high {
            color: var(--text-primary);
            font-weight: 700;
        }

        /* Bars */
        .bar {
            height: 100%;
            min-width: 0;
            border-radius: 2px;
        }

        .bar-call {
            background: linear-gradient(270deg, var(--call-color), rgba(77, 208, 225, 0.2));
        }

        .bar-put {
            background: linear-gradient(90deg, var(--put-color), rgba(255, 183, 77, 0.2));
        }

        /* ===== PLACEHOLDER ===== */
        .placeholder-msg {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 30px;
            text-align: center;
            color: var(--text-muted);
            gap: 10px;
        }

        .placeholder-msg .icon {
            font-size: 36px;
            opacity: 0.5;
        }

        .placeholder-msg .title {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-secondary);
        }

        .placeholder-msg .desc {
            font-size: 12px;
            max-width: 320px;
            line-height: 1.6;
        }

        /* ===== LOADING ===== */
        .loading-overlay {
            position: fixed;
            inset: 0;
            background: rgba(10, 10, 18, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            transition: opacity 0.5s;
        }

        .loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .spinner {
            width: 44px;
            height: 44px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .loading-text {
            margin-top: 14px;
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 500;
        }

        /* ===== INFO FOOTER ===== */
        .info-footer {
            display: flex;
            align-items: center;
            padding: 6px 24px;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border);
            flex-shrink: 0;
            gap: 24px;
            font-size: 11px;
            flex-wrap: wrap;
        }

        .info-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .info-label {
            color: var(--text-muted);
        }

        .info-value {
            color: var(--text-primary);
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        /* ===== ANALYSIS TAB ===== */
        .analysis-container {
            flex: 1;
            display: none;
            flex-direction: column;
            background: var(--bg-primary);
            overflow-y: auto;
            padding: 24px;
            gap: 20px;
        }

        .analysis-container.active {
            display: flex;
        }

        .analysis-header {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .ah-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .ah-price {
            font-size: 16px;
            color: var(--text-muted);
        }

        .ah-price span {
            font-size: 24px;
            font-weight: 800;
            color: var(--text-primary);
            margin-left: 8px;
        }

        .ah-bias {
            font-size: 20px;
            font-weight: 900;
            padding: 6px 16px;
            border-radius: 8px;
            letter-spacing: 1px;
        }

        .ah-action {
            font-size: 14px;
            color: var(--text-secondary);
            background: rgba(255, 255, 255, 0.03);
            padding: 12px 16px;
            border-radius: 8px;
            border-left: 4px solid var(--accent);
        }

        .analysis-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .analysis-card {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .analysis-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
            border-color: var(--border-active);
        }

        .ac-title {
            font-size: 14px;
            font-weight: 800;
            color: var(--text-primary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .ac-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
        }

        .ac-label {
            color: var(--text-muted);
        }

        .ac-val {
            font-weight: 700;
            color: var(--text-primary);
        }

        .ac-divider {
            height: 1px;
            background: var(--border);
            margin: 4px 0;
        }

        .ac-alert {
            margin-top: 8px;
            padding: 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            text-align: center;
        }

        .setup-box {
            margin-top: 10px;
            padding: 14px;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .setup-title {
            font-size: 12px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .setup-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
        }

        .setup-label {
            color: var(--text-secondary);
            font-weight: 600;
        }

        .setup-val {
            font-weight: 800;
            color: var(--text-primary);
        }

        .prob-badge {
            font-size: 10px;
            font-weight: 600;
            padding: 2px 6px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-secondary);
            margin-left: 6px;
        }

        .bias-bull {
            color: var(--green) !important;
            background: rgba(38, 166, 154, 0.1);
        }

        .bias-bear {
            color: var(--red) !important;
            background: rgba(239, 83, 80, 0.1);
        }

        .bias-neu {
            color: var(--text-secondary) !important;
            background: rgba(255, 255, 255, 0.05);
        }

        .bull {
            color: var(--green);
        }

        .bear {
            color: var(--red);
        }
    </style>
</head>

<body>

    <!-- Loading -->
    <div class="loading-overlay" id="loading">
        <div class="spinner"></div>
        <div class="loading-text">Fetching Vol2Vol Data...</div>
    </div>

    <!-- Header -->
    <div class="header">
        <div class="header-left">
            <div class="logo">⚡ Vol2Vol</div>
            <div class="contract-info">
                <span class="contract-name" id="contractName">Gold (GC)</span>
                <span class="contract-detail" id="contractDetail">—</span>
                <span class="price-display" id="priceDisplay">—</span>
                <span class="price-change up" id="priceChange">—</span>
            </div>
        </div>
        <div class="header-right">
            <span class="dte-badge" id="dteBadge">DTE —</span>
            <button class="refresh-btn" onclick="refreshData()">⟳ Refresh</button>
            <div class="status-indicator">
                <div class="status-dot" id="statusDot"></div>
                <span class="last-update" id="lastUpdate">—</span>
            </div>
        </div>
    </div>

    <!-- Contract Tabs -->
    <div class="tab-bar">
        <button class="tab-btn active" data-tab="current" onclick="switchTab('current')">
            Current <span class="tab-contract" id="tabContractCurrent"></span> <span class="tab-dte"
                id="tabDteCurrent"></span>
        </button>
        <button class="tab-btn" data-tab="friday" onclick="switchTab('friday')">
            Friday <span class="tab-contract" id="tabContractFriday"></span> <span class="tab-dte"
                id="tabDteFriday"></span>
        </button>
        <button class="tab-btn" data-tab="monthly" onclick="switchTab('monthly')">
            Monthly <span class="tab-contract" id="tabContractMonthly"></span> <span class="tab-dte"
                id="tabDteMonthly"></span>
        </button>
        <button class="tab-btn" data-tab="analysis" onclick="switchTab('analysis')"
            style="margin-left:auto; color: #ff9800;">
            🧠 Trade Setup
        </button>
        <button class="tab-btn" data-tab="chart" onclick="switchTab('chart')" style="color: var(--accent);">
            📈 Live Chart
        </button>
    </div>

    <!-- Summary Strip -->
    <div class="summary-strip" id="summaryStrip">
        <div class="summary-card">
            <span class="summary-label">Vol Settle (ATM)</span>
            <span class="summary-value val-cyan" id="sumVolSettle">—</span>
        </div>
        <div class="summary-card">
            <span class="summary-label">Expected Range</span>
            <span class="summary-value val-gold" id="sumExpRange">—</span>

    <script>
        // ========== CONFIG ==========
        const PAGETH_BASE = 'https://raw.githubusercontent.com/pageth/Vol2VolData/main';
        const MY_BASE = 'https://raw.githubusercontent.com/kitkonsss/vacant-exoplanet/main';

        const CONFIG = {
            contracts: {
                current: {
                    label: 'Current',
                    intradayUrl: MY_BASE + '/data/current_IntradayData.txt',
                    oiUrl: MY_BASE + '/data/current_OIData.txt',
                },
                friday: {
                    label: 'Friday',
                    intradayUrl: MY_BASE + '/data/friday_IntradayData.txt',
                    oiUrl: MY_BASE + '/data/friday_OIData.txt',
                },
                monthly: {
                    label: 'Monthly',
                    intradayUrl: MY_BASE + '/data/monthly_IntradayData.txt',
                    oiUrl: MY_BASE + '/data/monthly_OIData.txt',
                },
                analysis: { label: 'Trade Setup' },
                chart: { label: 'Live Chart' } // Dummy for the chart tab
            },
            refreshIntervalMs: 1800000, // 30 minutes
            visibleStrikeRange: 350,
            barMaxWidth: 180,
            oiHotThreshold: 100,
            volHotThreshold: 80,
        };

        let state = {
            activeTab: 'current',
            data: { current: {}, friday: {}, monthly: {}, analysis: {}, chart: {} },
            refreshTimer: null,
            chartInitialized: false
        };

        // ========== MATH ==========
        function normalCDF(x) {
            const t = 1 / (1 + 0.2316419 * Math.abs(x));
            const d = 0.3989423 * Math.exp(-x * x / 2);
            const p = d * t * (0.3193815 + t * (-0.3565638 + t * (1.781478 + t * (-1.821256 + t * 1.330274))));
            return x > 0 ? 1 - p : p;
        }

        function calcDelta(F, K, sigma, t, isCall) {
            if (sigma <= 0 || t <= 0) return isCall ? (F > K ? 1 : 0) : (F < K ? -1 : 0);
            const d1 = (Math.log(F / K) + 0.5 * sigma * sigma * t) / (sigma * Math.sqrt(t));
            return isCall ? normalCDF(d1) : normalCDF(d1) - 1;
        }

        // ========== PARSE ==========
        function parseVol2VolData(text) {
            const lines = text.trim().split('\n');
            if (lines.length < 2) return null;
            const header = lines[0];
            const dteMatch = header.match(/\(([\d.]+)\s*DTE\)/);
            const priceMatch = header.match(/vs\s+([\d.]+)/);
            const changeMatches = header.match(/\(([+-]?[\d.]+)\)/g);
            const typeMatch = header.match(/- (.+)$/);

            let contract = '';
            const cMatch1 = header.match(/Contract:\s+(\S+)/);
            const cMatch2 = header.match(/\)\s+(\S+)\s+\(/);
            if (cMatch1) contract = cMatch1[1];
            else if (cMatch2) contract = cMatch2[1];

            const dte = dteMatch ? parseFloat(dteMatch[1]) : 0;
            const underlying = priceMatch ? parseFloat(priceMatch[1]) : 0;
            let change = 0;
            if (changeMatches && changeMatches.length >= 2) {
                change = parseFloat(changeMatches[changeMatches.length - 1].replace(/[()]/g, ''));
            }
            const dataType = typeMatch ? typeMatch[1].trim() : '';

            // Extract Header Totals (Fix for missing tail data)
            // Header: ... Put: 4,827 Call: 4,131 ...
            const putTotalMatch = header.match(/Put:\s+([\d,]+)/);
            const callTotalMatch = header.match(/Call:\s+([\d,]+)/);
            const totalPut = putTotalMatch ? parseInt(putTotalMatch[1].replace(/,/g, '')) : undefined;
            const totalCall = callTotalMatch ? parseInt(callTotalMatch[1].replace(/,/g, '')) : undefined;

            const strikes = [];
            for (let i = 2; i < lines.length; i++) {
                const p = lines[i].split(',');
                if (p.length >= 4) {
                    strikes.push({
                        strike: parseFloat(p[0]),
                        call: parseInt(p[1].replace(/,/g, '')),
                        put: parseInt(p[2].replace(/,/g, '')),
                        volSettle: parseFloat(p[3]),
                        total: parseInt(p[1].replace(/,/g, '')) + parseInt(p[2].replace(/,/g, '')),
                    });
                }
            }

            // Check if underlying is valid (sometimes it's 0 if header regex failed)
            let finalUnderlying = underlying;
            if (finalUnderlying === 0 && strikes.length > 0) {
                // Fallback: use median strike
                const sorted = [...strikes].sort((a, b) => a.strike - b.strike);
                const mid = Math.floor(sorted.length / 2);
                finalUnderlying = sorted[mid].strike;
            }

            return { header, dte, underlying: finalUnderlying, change, dataType, contract, strikes, totalPut, totalCall };
        }

        // ========== FETCH ==========
        async function fetchTabData(tabKey) {
            const cfg = CONFIG.contracts[tabKey];
            if (!cfg.intradayUrl && !cfg.oiUrl) {
                state.data[tabKey] = { intraday: null, oi: null };
                return;
            }
            try {
                const ts = Date.now();
                const promises = [];
                promises.push(cfg.intradayUrl ? fetch(cfg.intradayUrl + '?t=' + ts) : Promise.resolve(null));
                promises.push(cfg.oiUrl ? fetch(cfg.oiUrl + '?t=' + ts) : Promise.resolve(null));
                const [intRes, oiRes] = await Promise.all(promises);
                state.data[tabKey] = {
                    intraday: intRes?.ok ? parseVol2VolData(await intRes.text()) : null,
                    oi: oiRes?.ok ? parseVol2VolData(await oiRes.text()) : null,
                };
            } catch (e) {
                console.error(`Fetch error (${tabKey}):`, e);
            }
        }

        // ========== RENDER ROWS ==========
        function renderPanel(containerId, data, hotThreshold) {
            const container = document.getElementById(containerId);
            if (!data?.strikes) {
                container.innerHTML = '<div class="placeholder-msg"><div class="icon">📊</div><div class="desc">No data available</div></div>';
                return;
            }
            const underlying = data.underlying;
            const filtered = data.strikes.filter(s =>
                s.strike >= underlying - CONFIG.visibleStrikeRange &&
                s.strike <= underlying + CONFIG.visibleStrikeRange &&
                s.total >= hotThreshold
            );
            if (filtered.length === 0) {
                container.innerHTML = '<div class="placeholder-msg"><div class="icon">📭</div><div class="desc">No data in visible range matching filters</div></div>';
                return;
            }

            let maxCallStrike = null;
            let maxPutStrike = null;
            let maxCallVal = 0;
            let maxPutVal = 0;
            let maxSingle = 1;

            for (const s of filtered) {
                if (s.call > maxCallVal) { maxCallVal = s.call; maxCallStrike = s; }
                if (s.put > maxPutVal) { maxPutVal = s.put; maxPutStrike = s; }
                maxSingle = Math.max(maxSingle, s.call, s.put);
            }

            filtered.sort((a, b) => b.strike - a.strike);
            const closestStrike = filtered.reduce((prev, curr) =>
                Math.abs(curr.strike - underlying) < Math.abs(prev.strike - underlying) ? curr : prev, filtered[0]);

            // Grid header
            let html = '<div class="grid-header">' +
                '<span class="h-call">OTM Δ</span>' +
                '<span class="h-call h-right">Call</span>' +
                '<span></span>' +
                '<span>Strike</span>' +
                '<span></span>' +
                '<span class="h-put h-left">Put</span>' +
                '<span class="h-put">OTM Δ</span>' +
                '<span class="h-right">Total</span>' +
                '</div>';

            for (const s of filtered) {
                const isATM = s === closestStrike;
                const isHot = !isATM && s.total >= hotThreshold;

                const isMaxCall = s === maxCallStrike && s.call > 0;
                const isMaxPut = s === maxPutStrike && s.put > 0;

                let rowCls = 'row';
                if (isATM) rowCls += ' atm';
                else if (isHot) rowCls += ' hot';

                // Strike color
                let strikeStyle = '';
                if (isATM) {
                    strikeStyle = 'color:#ffffff;font-weight:800;font-size:12px;';
                } else if (s.strike > underlying) {
                    strikeStyle = 'color:var(--green);';
                } else {
                    strikeStyle = 'color:var(--red);';
                }

                let strikeCls = 'row-strike';
                if (isATM) strikeCls += ' atm';
                else if (isHot) strikeCls += ' hot';

                let callCls = 'row-call';
                if (isMaxCall) callCls += ' max-call';

                let putCls = 'row-put';
                if (isMaxPut) putCls += ' max-put';

                // Bar width as percentage of container (use 100% max)
                const callPct = Math.max(0, (s.call / maxSingle) * 100);
                const putPct = Math.max(0, (s.put / maxSingle) * 100);

                // Delta
                const t = data.dte / 365;
                const callDeltaRaw = calcDelta(underlying, s.strike, s.volSettle, t, true);
                const putDeltaRaw = calcDelta(underlying, s.strike, s.volSettle, t, false);

                // Show as OTM Delta (probability)
                const callDeltaOTM = s.strike > underlying ? callDeltaRaw : (1 - callDeltaRaw);
                const putDeltaOTM = s.strike < underlying ? Math.abs(putDeltaRaw) : (1 - Math.abs(putDeltaRaw));

                const callDeltaStr = Math.round(callDeltaOTM * 100);
                const putDeltaStr = Math.round(putDeltaOTM * 100);

                html += `<div class="${rowCls}">` +
                    `<span class="row-delta-call">${callDeltaStr}</span>` +
                    `<span class="${callCls}">${s.call > 0 ? s.call.toLocaleString() : ''}</span>` +
                    `<div class="row-bar-call">${s.call > 0 ? `<div class="bar bar-call" style="width:${callPct}%"></div>` : ''}</div>` +
                    `<span class="${strikeCls}" style="${strikeStyle}">${s.strike}</span>` +
                    `<div class="row-bar-put">${s.put > 0 ? `<div class="bar bar-put" style="width:${putPct}%"></div>` : ''}</div>` +
                    `<span class="${putCls}">${s.put > 0 ? s.put.toLocaleString() : ''}</span>` +
                    `<span class="row-delta-put">${putDeltaStr}</span>` +
                    `<span class="row-total ${isHot || (isATM && s.total >= hotThreshold) ? 'high' : ''}">${s.total.toLocaleString()}</span>` +
                    `</div>`;
            }
            container.innerHTML = html;
        }

        // ========== UPDATE SUMMARY ==========
        function updateSummary(intraday, oi) {
            const data = oi || intraday;
            if (!data) return;

            // Header info
            document.getElementById('contractName').textContent = 'Gold (GC)';
            document.getElementById('contractDetail').textContent = data.contract || '';
            document.getElementById('priceDisplay').textContent = data.underlying.toFixed(1);
            const ce = document.getElementById('priceChange');
            ce.textContent = `${data.change >= 0 ? '+' : ''}${data.change.toFixed(1)}`;
            ce.className = `price-change ${data.change >= 0 ? 'up' : 'down'}`;
            document.getElementById('dteBadge').textContent = `DTE ${data.dte.toFixed(2)}`;
            document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString('th-TH');
            document.getElementById('footerContract').textContent = data.contract || '';

            // Vol Settle & Expected Range
            if (intraday?.strikes) {
                const atm = intraday.strikes.reduce((p, c) =>
                    Math.abs(c.strike - data.underlying) < Math.abs(p.strike - data.underlying) ? c : p);
                if (atm.volSettle > 0) {
                    document.getElementById('sumVolSettle').textContent = (atm.volSettle * 100).toFixed(2) + '%';
                    const er = data.underlying * atm.volSettle * Math.sqrt(data.dte / 365);
                    document.getElementById('sumExpRange').textContent = `±${er.toFixed(1)}`;
                    document.getElementById('sumExpRangePrices').textContent =
                        `$${(data.underlying - er).toFixed(0)} – $${(data.underlying + er).toFixed(0)}`;
                }
                document.getElementById('footerDataType').textContent = intraday.dataType || '';
            }

            // OI stats
            if (oi?.strikes) {
                const mx = oi.strikes.reduce((p, c) => c.total > p.total ? c : p);
                document.getElementById('sumMaxOI').textContent = mx.strike.toString();
                document.getElementById('sumMaxOIDetail').textContent = `Total: ${mx.total} (C:${mx.call} P:${mx.put})`;

                // Use Header Totals if available (more accurate), else sum rows
                let tc = 0, tp = 0;
                if (oi.totalCall !== undefined && oi.totalPut !== undefined) {
                    tc = oi.totalCall;
                    tp = oi.totalPut;
                } else {
                    oi.strikes.forEach(s => { tc += s.call; tp += s.put; });
                }

                document.getElementById('sumTotalCall').textContent = tc.toLocaleString();
                document.getElementById('sumTotalPut').textContent = tp.toLocaleString();
                document.getElementById('sumPCRatio').textContent = tc > 0 ? (tp / tc).toFixed(2) : '—';
            }
        }

        // ========== TAB SWITCH ==========
        async function switchTab(tabKey) {
            state.activeTab = tabKey;
            document.querySelectorAll('.tab-btn').forEach(b => {
                b.classList.toggle('active', b.dataset.tab === tabKey);
            });

            const mainContainer = document.getElementById('mainContainer');
            const chartContainer = document.getElementById('chartContainer');
            const summaryStrip = document.getElementById('summaryStrip');

            if (tabKey === 'chart') {
                mainContainer.classList.add('hide-main');
                summaryStrip.style.display = 'none';
                document.getElementById('analysisContainer').classList.remove('active');
                chartContainer.classList.add('active');
                if (!state.chartInitialized) {
                    initLightweightChart();
                    state.chartInitialized = true;
                } else {
                    plotWallsOnChart(); // Re-plot lines in case data updated
                }
                return;
            } else if (tabKey === 'analysis') {
                mainContainer.classList.add('hide-main');
                summaryStrip.style.display = 'none';
                chartContainer.classList.remove('active');
                document.getElementById('analysisContainer').classList.add('active');
                renderAnalysisTab();
                return;
            } else {
                mainContainer.classList.remove('hide-main');
                summaryStrip.style.display = 'flex';
                chartContainer.classList.remove('active');
                document.getElementById('analysisContainer').classList.remove('active');
            }

            // Fetch data if not loaded yet
            const tabData = state.data[tabKey];
            if (!tabData || (!tabData.intraday && !tabData.oi)) {
                await fetchTabData(tabKey);
            }
            renderActiveTab();
        }

        let chartInstance = null;
        let candleSeries = null;
        let callLine = null;
        let putLine = null;

        async function initLightweightChart() {
            const container = document.getElementById('lwc_chart');
            if (!container) return;

            chartInstance = LightweightCharts.createChart(container, {
                layout: {
                    background: { type: 'solid', color: '#131722' },
                    textColor: '#9598a1',
                },
                grid: {
                    vertLines: { color: '#2a2e3e' },
                    horzLines: { color: '#2a2e3e' },
                },
                timeScale: {
                    timeVisible: true,
                    secondsVisible: false,
                }
            });

            candleSeries = chartInstance.addCandlestickSeries({
                upColor: '#26a69a',
                downColor: '#ef5350',
                borderVisible: false,
                wickUpColor: '#26a69a',
                wickDownColor: '#ef5350'
            });

            // Fetch GC=F Data from a free Yahoo Finance API proxy
            try {
                // Using a proxy or direct fetch if CORS allows. 
                // Since this is client-side, we'll use a public CORS proxy for demo purposes to hit Yahoo Finance
                const res = await fetch('https://query1.finance.yahoo.com/v8/finance/chart/GC=F?interval=15m&range=5d');
                const data = await res.json();
                const result = data.chart.result[0];
                const chartData = [];
                for (let i = 0; i < result.timestamp.length; i++) {
                    chartData.push({
                        time: result.timestamp[i],
                        open: result.indicators.quote[0].open[i],
                        high: result.indicators.quote[0].high[i],
                        low: result.indicators.quote[0].low[i],
                        close: result.indicators.quote[0].close[i]
                    });
                }
                // Filter out nulls
                const validData = chartData.filter(d => d.open !== null && d.time !== null);
                candleSeries.setData(validData);
            } catch (err) {
                console.error("Failed to load chart data", err);
            }

            // Sync with current tab data to plot walls
            plotWallsOnChart();

            // Handle resize
            window.addEventListener('resize', () => {
                chartInstance.resize(container.clientWidth, container.clientHeight);
            });
        }

        function plotWallsOnChart() {
            if (!candleSeries) return;

            // Clear existing lines
            if (callLine) candleSeries.removePriceLine(callLine);
            if (putLine) candleSeries.removePriceLine(putLine);
            callLine = null;
            putLine = null;

            const tData = state.data['current']; // use current DTE for walls
            if (!tData || !tData.oi || !tData.oi.strikes) return;

            let maxCallVal = 0;
            let maxCallStrike = 0;
            let maxPutVal = 0;
            let maxPutStrike = 0;

            tData.oi.strikes.forEach(s => {
                if (s.call > maxCallVal) { maxCallVal = s.call; maxCallStrike = s.strike; }
                if (s.put > maxPutVal) { maxPutVal = s.put; maxPutStrike = s.strike; }
            });

            if (maxCallStrike > 0) {
                callLine = candleSeries.createPriceLine({
                    price: maxCallStrike,
                    color: '#26a69a',
                    lineWidth: 2,
                    lineStyle: LightweightCharts.LineStyle.Dashed,
                    axisLabelVisible: true,
                    title: 'Max Call (Resist)',
                });
            }

            if (maxPutStrike > 0) {
                putLine = candleSeries.createPriceLine({
                    price: maxPutStrike,
                    color: '#ef5350',
                    lineWidth: 2,
                    lineStyle: LightweightCharts.LineStyle.Dashed,
                    axisLabelVisible: true,
                    title: 'Max Put (Support)',
                });
            }
        }

        function renderAnalysisTab() {
            const container = document.getElementById('analysisGrid');
            const header = document.getElementById('analysisHeader');

            const timeframes = [
                { key: 'current', label: 'Daily (Current)' },
                { key: 'friday', label: 'Weekly (Friday)' },
                { key: 'monthly', label: 'Monthly' }
            ];

            let html = '';
            let biases = [];

            // Sync underlying price across all timeframes since they map to the same Future
            let globalUnderlying = 0;
            if (state.data.current?.oi?.underlying) globalUnderlying = state.data.current.oi.underlying;
            else if (state.data.monthly?.oi?.underlying) globalUnderlying = state.data.monthly.oi.underlying;
            else if (state.data.friday?.oi?.underlying) globalUnderlying = state.data.friday.oi.underlying;

            for (const tf of timeframes) {
                const data = state.data[tf.key]?.oi;
                const intraday = state.data[tf.key]?.intraday;
                if (!data || !data.strikes || data.strikes.length === 0) {
                    html += `<div class="analysis-card"><div class="ac-title">${tf.label}</div><div class="placeholder-msg" style="padding:20px 0;"><div class="desc">Loading or No Data</div></div></div>`;
                    continue;
                }

                // Force global underlying if available to prevent median-strike miscalculations on missing headers
                const uPrice = globalUnderlying > 0 ? globalUnderlying : data.underlying;

                let tc = data.totalCall !== undefined ? data.totalCall : data.strikes.reduce((sum, s) => sum + s.call, 0);
                let tp = data.totalPut !== undefined ? data.totalPut : data.strikes.reduce((sum, s) => sum + s.put, 0);
                const pcr = tc > 0 ? (tp / tc) : 1;

                // Find Support (Max Put) and Resistance (Max Call)
                let maxCall = data.strikes.reduce((p, c) => c.call > p.call ? c : p);
                let maxPut = data.strikes.reduce((p, c) => c.put > p.put ? c : p);

                // Determine bias
                let biasStr = 'Neutral';
                let biasCls = 'neu';
                let biasScore = 0;

                if (pcr > 1.2) { biasStr = 'Bearish (Puts > Calls)'; biasCls = 'bear'; biasScore = -1; }
                else if (pcr < 0.8) { biasStr = 'Bullish (Calls > Puts)'; biasCls = 'bull'; biasScore = 1; }

                // Check Squeeze
                let squeezeTxt = '';
                if (Math.abs(uPrice - maxCall.strike) < 30 && tc > tp) {
                    squeezeTxt = `<div class="ac-alert bias-bull">🔥 Near Call Wall (Gamma Squeeze Up Risk)</div>`;
                    biasScore += 1;
                } else if (Math.abs(uPrice - maxPut.strike) < 30 && tp > tc) {
                    squeezeTxt = `<div class="ac-alert bias-bear">🩸 Near Put Wall (Liquidity Drop Risk)</div>`;
                    biasScore -= 1;
                }

                biases.push({ score: biasScore, label: tf.label });

                // 1-Day Expected Move for Setups
                let rangeTxt = '—';
                let setupHtml = '';

                // Fallback to OI Data if Intraday is missing (e.g., Weekends)
                const sourceStrikes = intraday?.strikes?.length > 0 ? intraday.strikes : data.strikes;

                if (sourceStrikes && sourceStrikes.length > 0) {
                    const atm = sourceStrikes.reduce((p, c) => Math.abs(c.strike - uPrice) < Math.abs(p.strike - uPrice) ? c : p);
                    if (atm.volSettle > 0) {
                        // Expiry Total Expected Range
                        const erTotal = uPrice * atm.volSettle * Math.sqrt(data.dte / 365);
                        rangeTxt = `$${(uPrice - erTotal).toFixed(0)} – $${(uPrice + erTotal).toFixed(0)} <span style="font-size:11px; color:var(--text-muted)">(±${erTotal.toFixed(1)})</span>`;

                        // 1-Day Expected Move
                        const er1Day = uPrice * atm.volSettle * Math.sqrt(1 / 365);

                        // Setup Generation Logic
                        let setup1Html = '';
                        let setup2Html = '';

                        const t1Day = 1 / 365;

                        // Calculate Probabilities (OTM Delta representation)
                        const getProb = (strike) => {
                            const callD = calcDelta(uPrice, strike, atm.volSettle, t1Day, true);
                            const putD = calcDelta(uPrice, strike, atm.volSettle, t1Day, false);
                            const otmD = strike > uPrice ? callD : (1 - Math.abs(putD));
                            return Math.round(otmD * 100);
                        };

                        if (biasScore > 0) { // Bullish
                            // Entry 1 (Aggressive Dip)
                            const e1 = uPrice - (er1Day * 0.4);
                            const sl1 = e1 - 10;
                            const tp1 = uPrice + (er1Day * 0.5);

                            // Entry 2 (Conservative Dip)
                            const e2 = uPrice - (er1Day * 0.8);
                            const sl2 = e2 - 10;
                            const tp2 = uPrice + (er1Day * 0.2);

                            setup1Html = `
                            <div class="setup-box">
                                <div class="setup-title bull">🟢 BUY แผน 1: ย่อตื้น (Aggressive)</div>
                                <div class="setup-row"><span class="setup-label">Entry Zone</span><span class="setup-val">$${e1.toFixed(1)} <span class="prob-badge" title="โอกาสลงมาเกี่ยว">${getProb(e1)}% Hit</span></span></div>
                                <div class="setup-row"><span class="setup-label">🎯 TP</span><span class="setup-val">$${tp1.toFixed(1)} <span class="prob-badge">${getProb(tp1)}% Hit</span></span></div>
                                <div class="setup-row"><span class="setup-label">🚫 SL (Strict)</span><span class="setup-val" style="color:var(--red);">$${sl1.toFixed(1)} <span style="font-size:10px; font-weight:normal; color:var(--text-muted);">(-$10)</span></span></div>
                            </div>`;

                            setup2Html = `
                            <div class="setup-box">
                                <div class="setup-title" style="color: var(--cyan);">🔵 BUY แผน 2: ย่อลึก (Conservative)</div>
                                <div class="setup-row"><span class="setup-label">Entry Zone</span><span class="setup-val">$${e2.toFixed(1)} <span class="prob-badge" title="โอกาสลงมาเกี่ยว">${getProb(e2)}% Hit</span></span></div>
                                <div class="setup-row"><span class="setup-label">🎯 TP</span><span class="setup-val">$${tp2.toFixed(1)} <span class="prob-badge">${getProb(tp2)}% Hit</span></span></div>
                                <div class="setup-row"><span class="setup-label">🚫 SL (Strict)</span><span class="setup-val" style="color:var(--red);">$${sl2.toFixed(1)} <span style="font-size:10px; font-weight:normal; color:var(--text-muted);">(-$10)</span></span></div>
                            </div>`;
                        } else if (biasScore < 0) { // Bearish
                            // Entry 1 (Aggressive Rally)
                            const e1 = uPrice + (er1Day * 0.4);
                            const sl1 = e1 + 10;
                            const tp1 = uPrice - (er1Day * 0.5);

                            // Entry 2 (Conservative Rally)
                            const e2 = uPrice + (er1Day * 0.8);
                            const sl2 = e2 + 10;
                            const tp2 = uPrice - (er1Day * 0.2);

                            setup1Html = `
                            <div class="setup-box">
                                <div class="setup-title bear">🔴 SELL แผน 1: เด้งสั้น (Aggressive)</div>
                                <div class="setup-row"><span class="setup-label">Entry Zone</span><span class="setup-val">$${e1.toFixed(1)} <span class="prob-badge" title="โอกาสขึ้นมาเกี่ยว">${getProb(e1)}% Hit</span></span></div>
                                <div class="setup-row"><span class="setup-label">🎯 TP</span><span class="setup-val">$${tp1.toFixed(1)} <span class="prob-badge">${getProb(tp1)}% Hit</span></span></div>
                                <div class="setup-row"><span class="setup-label">🚫 SL (Strict)</span><span class="setup-val" style="color:var(--red);">$${sl1.toFixed(1)} <span style="font-size:10px; font-weight:normal; color:var(--text-muted);">(-$10)</span></span></div>
                            </div>`;

                            setup2Html = `
                            <div class="setup-box">
                                <div class="setup-title" style="color: var(--orange);">🟠 SELL แผน 2: เด้งสูง (Conservative)</div>
                                <div class="setup-row"><span class="setup-label">Entry Zone</span><span class="setup-val">$${e2.toFixed(1)} <span class="prob-badge" title="โอกาสขึ้นมาเกี่ยว">${getProb(e2)}% Hit</span></span></div>
                                <div class="setup-row"><span class="setup-label">🎯 TP</span><span class="setup-val">$${tp2.toFixed(1)} <span class="prob-badge">${getProb(tp2)}% Hit</span></span></div>
                                <div class="setup-row"><span class="setup-label">🚫 SL (Strict)</span><span class="setup-val" style="color:var(--red);">$${sl2.toFixed(1)} <span style="font-size:10px; font-weight:normal; color:var(--text-muted);">(-$10)</span></span></div>
                            </div>`;
                        } else { // Neutral (Sideways / Ranging)
                            // Ping Pong Setup: Buy Low, Sell High

                            // Entry 1 (Buy Low / Dips)
                            const eBuy = uPrice - (er1Day * 0.6);
                            const slBuy = eBuy - 10;
                            const tpBuy = uPrice + (er1Day * 0.3); // Aim for mean reversion to midpoint

                            // Entry 2 (Sell High / Rallies)
                            const eSell = uPrice + (er1Day * 0.6);
                            const slSell = eSell + 10;
                            const tpSell = uPrice - (er1Day * 0.3);

                            setup1Html = `
                            <div class="setup-box" style="border-left: 3px solid var(--put-color);">
                                <div class="setup-title" style="color: var(--put-color);">🟡 PING PONG (รับล่าง: BUY)</div>
                                <div class="setup-row"><span class="setup-label">Entry Zone</span><span class="setup-val">$${eBuy.toFixed(1)} <span class="prob-badge" title="โอกาสย่อมาชน">${getProb(eBuy)}% Hit</span></span></div>
                                <div class="setup-row"><span class="setup-label">🎯 TP (Reversion)</span><span class="setup-val">$${tpBuy.toFixed(1)} <span class="prob-badge">${getProb(tpBuy)}% Hit</span></span></div>
                                <div class="setup-row"><span class="setup-label">🚫 SL (Strict)</span><span class="setup-val" style="color:var(--red);">$${slBuy.toFixed(1)} <span style="font-size:10px; font-weight:normal; color:var(--text-muted);">(-$10)</span></span></div>
                            </div>`;

                            setup2Html = `
                            <div class="setup-box" style="border-left: 3px solid var(--call-color);">
                                <div class="setup-title" style="color: var(--call-color);">🟡 PING PONG (ต้านบน: SELL)</div>
                                <div class="setup-row"><span class="setup-label">Entry Zone</span><span class="setup-val">$${eSell.toFixed(1)} <span class="prob-badge" title="โอกาสเด้งไปชน">${getProb(eSell)}% Hit</span></span></div>
                                <div class="setup-row"><span class="setup-label">🎯 TP (Reversion)</span><span class="setup-val">$${tpSell.toFixed(1)} <span class="prob-badge">${getProb(tpSell)}% Hit</span></span></div>
                                <div class="setup-row"><span class="setup-label">🚫 SL (Strict)</span><span class="setup-val" style="color:var(--red);">$${slSell.toFixed(1)} <span style="font-size:10px; font-weight:normal; color:var(--text-muted);">(-$10)</span></span></div>
                            </div>`;
                        }

                        setupHtml = setup1Html + setup2Html;
                    }
                }

                html += `
                <div class="analysis-card">
                    <div class="ac-title">${tf.label} <span style="font-size:10px; color:var(--accent); font-weight:800;">[${data.dte.toFixed(1)} DTE]</span></div>
                    
                    <div class="ac-row"><span class="ac-label">Trend Bias</span><span class="ac-val bias-${biasCls}">${biasStr}</span></div>
                    <div class="ac-row"><span class="ac-label">P/C Ratio</span><span class="ac-val">${pcr.toFixed(2)}</span></div>
                    <div class="ac-divider"></div>
                    
                    <div class="ac-row"><span class="ac-label">Resistance (Max Call)</span><span class="ac-val" style="color:var(--call-color); font-weight:800;">$${maxCall.strike}</span></div>
                    <div class="ac-row"><span class="ac-label">Support (Max Put)</span><span class="ac-val" style="color:var(--put-color); font-weight:800;">$${maxPut.strike}</span></div>
                    <div class="ac-divider"></div>
                    
                    <div class="ac-row"><span class="ac-label">Total Exp. Range</span><span class="ac-val" style="color:var(--text-primary);">${rangeTxt}</span></div>
                    ${squeezeTxt}
                    ${setupHtml}
                </div>`;
            }
            container.innerHTML = html;

            // Overall Bias
            let totalScore = biases.reduce((s, b) => s + b.score, 0);
            let overallStr = 'RANGING / NEUTRAL';
            let overallCls = 'neu';
            let overallAction = 'Trade within the Expected Range. Sell Premium or play mean reversion.';

            if (totalScore >= 3) {
                overallStr = 'STRONG BULLISH 🚀'; overallCls = 'bull';
                overallAction = 'Momentum is up across timeframes. Buy Dips near Put Wall Support. Look for breakouts above Call Walls.';
            } else if (totalScore > 0) {
                overallStr = 'SLIGHTLY BULLISH 📈'; overallCls = 'bull';
                overallAction = 'Favor long setups but respect Resistance levels. Watch for weakness at Call Walls.';
            } else if (totalScore <= -3) {
                overallStr = 'STRONG BEARISH 🩸'; overallCls = 'bear';
                overallAction = 'Momentum is down. Sell Rallies near Call Wall Resistance. Watch for breakdowns through Support.';
            } else if (totalScore < 0) {
                overallStr = 'SLIGHTLY BEARISH 📉'; overallCls = 'bear';
                overallAction = 'Favor short setups but respect Support levels. Watch for bounces off Put Walls.';
            }

            if (globalUnderlying > 0) {
                header.innerHTML = `
                    <div class="ah-top">
                        <div class="ah-price">Current Price: <span>$${globalUnderlying.toFixed(1)}</span></div>
                        <div class="ah-bias bias-${overallCls}">${overallStr}</div>
                    </div>
                    <div class="ah-action"><strong>Setup Strategy:</strong> ${overallAction}</div>
                `;
            } else {
                header.innerHTML = `<div class="placeholder-msg">Loading data...</div>`;
            }
        }

        function renderActiveTab() {
            if (state.activeTab === 'chart') return;
            if (state.activeTab === 'analysis') {
                renderAnalysisTab();
                return;
            }

            const tabData = state.data[state.activeTab];
            if (!tabData || (!tabData.intraday && !tabData.oi)) {
                // Show placeholder
                const oiC = document.getElementById('oiContainer');
                const volC = document.getElementById('volContainer');
                oiC.innerHTML = `<div class="placeholder-msg"><div class="icon">🔒</div><div class="title">No Data Yet</div><div class="desc">This contract requires a QuikStrike scraper. Set up the Python scraper to fetch ${CONFIG.contracts[state.activeTab].label} contract data.</div></div>`;
                volC.innerHTML = `<div class="placeholder-msg"><div class="icon">🔒</div><div class="title">No Data Yet</div><div class="desc">Configure the scraper to populate ${CONFIG.contracts[state.activeTab].label} contract Intraday Volume.</div></div>`;

                // Clear summary
                ['sumVolSettle', 'sumExpRange', 'sumMaxOI', 'sumTotalCall', 'sumTotalPut', 'sumPCRatio'].forEach(id => {
                    document.getElementById(id).textContent = '—';
                });
                document.getElementById('sumExpRangePrices').textContent = '';
                document.getElementById('sumMaxOIDetail').textContent = '';
                return;
            }
            renderPanel('oiContainer', tabData.oi, CONFIG.oiHotThreshold);
            renderPanel('volContainer', tabData.intraday, CONFIG.volHotThreshold);
            updateSummary(tabData.intraday, tabData.oi);
        }

        // ========== REFRESH ==========
        async function refreshData() {
            const btn = document.querySelector('.refresh-btn');
            btn.textContent = '⟳ Loading...';
            btn.disa = await fetchTabData(state.activeTab);
            renderActiveTab();
            btn.textContent = '⟳ Refresh';
            btn.disabled = false;
        }

        // ========== WEEKEND SCHEDULE ==========
        // On Sat/Sun (Thai time, UTC+7): fetch once at 13:00, then stop until next day.
        // On weekdays: refresh every CONFIG.refreshIntervalMs.

        function getThaiTime() {
            // Thai Standard Time = UTC+7
            const now = new Date();
            const utcMs = now.getTime() + now.getTimezoneOffset() * 60000;
            return new Date(utcMs + 7 * 3600000);
        }

        function isWeekend() {
            const d = getThaiTime().getDay(); // 0=Sun, 6=Sat
            return d === 0 || d === 6;
        }

        function scheduleRefresh() {
            if (state.refreshTimer) {
                clearTimeout(state.refreshTimer);
                clearInterval(state.refreshTimer);
                state.refreshTimer = null;
            }

            if (!isWeekend()) {
                // Weekday: normal periodic refresh
                state.refreshTimer = setInterval(refreshData, CONFIG.refreshIntervalMs);
                return;
            }

            // Weekend: schedule a single fetch at 13:00 Thai if not yet done today
            const thai = getThaiTime();
            const thaiHour = thai.getHours();
            const thaiMin = thai.getMinutes();
            const thaiSec = thai.getSeconds();

            const todayKey = `${thai.getFullYear()}-${thai.getMonth()}-${thai.getDate()}`;

            if (state.weekendFetchedDate === todayKey) {
                // Already fetched today; check again at start of next day (midnight Thai)
                const msUntilMidnight = ((23 - thaiHour) * 3600 + (59 - thaiMin) * 60 + (60 - thaiSec)) * 1000;
                state.refreshTimer = setTimeout(() => {
                    state.weekendFetchedDate = null;
                    scheduleRefresh();
                }, msUntilMidnight);
                return;
            }

            const targetHour = 13;
            let msUntilTarget;
            if (thaiHour < targetHour || (thaiHour === targetHour && thaiMin === 0 && thaiSec === 0)) {
                // Before or exactly at 13:00 – wait
                msUntilTarget = ((targetHour - thaiHour) * 3600 - thaiMin * 60 - thaiSec) * 1000;
            } else {
                // After 13:00 on weekend: fetch immediately (missed window)
                msUntilTarget = 0;
            }

            state.refreshTimer = setTimeout(async () => {
                state.weekendFetchedDate = todayKey;
                await refreshData();
                scheduleRefresh(); // re-schedule (will wait until next day)
            }, msUntilTarget);
        }

        // ========== INIT ==========
        async function init() {
            state.weekendFetchedDate = null;

            // Fetch ALL tabs in parallel
            await Promise.all([
                fetchTabData('current'),
                fetchTabData('friday'),
                fetchTabData('monthly'),
            ]);

            // Update tab DTE labels
            for (const key of ['current', 'friday', 'monthly']) {
                const d = state.data[key]?.oi || state.data[key]?.intraday;
                if (d) {
                    const el = document.getElementById('tabDte' + key.charAt(0).toUpperCase() + key.slice(1));
                    if (el) el.textContent = `(${d.dte.toFixed(1)}d)`;

                    const contractEl = document.getElementById('tabContract' + key.charAt(0).toUpperCase() + key.slice(1));
                    if (contractEl && d.contract) contractEl.textContent = `[${d.contract}]`;
                }
            }

            renderActiveTab();
            document.getElementById('loading').classList.add('hidden');

            // Mark weekend initial load as done (we just fetched on init)
            if (isWeekend()) {
                const thai = getThaiTime();
                state.weekendFetchedDate = `${thai.getFullYear()}-${thai.getMonth()}-${thai.getDate()}`;
            }
            scheduleRefresh();
        }
        init();
    </script>
