<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gold Vol2Vol — Intraday Expected Range & OI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0c0c14;
            --bg-secondary: #12121c;
            --bg-panel: #181824;
            --bg-card: #1e1e2e;
            --border: #2a2a3e;
            --border-glow: rgba(240, 185, 11, 0.15);
            --text-primary: #e8e8f0;
            --text-secondary: #9090a8;
            --text-muted: #606078;
            --gold: #f0b90b;
            --gold-glow: rgba(240, 185, 11, 0.2);
            --orange: #ff9800;
            --orange-dim: rgba(255, 152, 0, 0.15);
            --cyan: #00e5ff;
            --pink: #ff4081;
            --green: #00e676;
            --red: #ff1744;
            --call-color: #4fc3f7;
            --call-bg: rgba(79, 195, 247, 0.12);
            --put-color: #ffb74d;
            --put-bg: rgba(255, 183, 77, 0.12);
        }

        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ===== HEADER ===== */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 20px;
            background: linear-gradient(180deg, var(--bg-secondary) 0%, var(--bg-primary) 100%);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .logo {
            font-size: 20px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--gold), #ffd54f);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 0.5px;
        }

        .contract-info {
            display: flex;
            align-items: center;
            gap: 14px;
            font-size: 13px;
        }

        .contract-name {
            color: var(--text-primary);
            font-weight: 700;
            font-size: 16px;
        }

        .contract-detail {
            color: var(--text-secondary);
            font-size: 12px;
        }

        .price-display {
            font-size: 22px;
            font-weight: 800;
            color: var(--gold);
            text-shadow: 0 0 20px var(--gold-glow);
        }

        .price-change {
            font-size: 13px;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 6px;
        }

        .price-change.up {
            color: var(--green);
            background: rgba(0, 230, 118, 0.1);
        }

        .price-change.down {
            color: var(--red);
            background: rgba(255, 23, 68, 0.1);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .dte-badge {
            background: linear-gradient(135deg, rgba(0, 229, 255, 0.12), rgba(0, 229, 255, 0.05));
            border: 1px solid rgba(0, 229, 255, 0.25);
            color: var(--cyan);
            padding: 4px 12px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 13px;
        }

        .refresh-btn {
            background: linear-gradient(135deg, rgba(240, 185, 11, 0.15), rgba(240, 185, 11, 0.05));
            border: 1px solid rgba(240, 185, 11, 0.3);
            color: var(--gold);
            padding: 7px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
            transition: all 0.25s;
        }

        .refresh-btn:hover {
            background: rgba(240, 185, 11, 0.25);
            border-color: var(--gold);
            box-shadow: 0 0 16px var(--gold-glow);
            transform: translateY(-1px);
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--green);
            box-shadow: 0 0 8px rgba(0, 230, 118, 0.5);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
                box-shadow: 0 0 8px rgba(0, 230, 118, 0.5);
            }

            50% {
                opacity: 0.5;
                box-shadow: 0 0 4px rgba(0, 230, 118, 0.2);
            }
        }

        .last-update {
            font-size: 11px;
            color: var(--text-muted);
        }

        /* ===== MAIN LAYOUT ===== */
        .main-container {
            display: grid;
            grid-template-columns: 260px 1fr 200px;
            flex: 1;
            overflow: hidden;
            min-height: 0;
        }

        /* ===== OI PANEL (LEFT) ===== */
        .oi-panel {
            background: var(--bg-secondary);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            z-index: 10;
        }

        .oi-panel-header {
            padding: 12px 14px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .oi-panel-title {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .oi-legend {
            display: flex;
            gap: 12px;
            font-size: 10px;
            font-weight: 600;
        }

        .oi-legend-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .oi-legend-dot {
            width: 8px;
            height: 8px;
            border-radius: 2px;
        }

        .oi-legend-dot.call {
            background: var(--call-color);
        }

        .oi-legend-dot.put {
            background: var(--put-color);
        }

        .oi-legend-call {
            color: var(--call-color);
        }

        .oi-legend-put {
            color: var(--put-color);
        }

        .oi-container {
            flex: 1;
            overflow-y: auto;
            padding: 2px 0;
        }

        .oi-container::-webkit-scrollbar {
            width: 3px;
        }

        .oi-container::-webkit-scrollbar-track {
            background: transparent;
        }

        .oi-container::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 2px;
        }

        .oi-row {
            display: flex;
            align-items: center;
            padding: 1px 10px;
            height: 24px;
            font-size: 11px;
            transition: background 0.15s;
            cursor: default;
            border-left: 2px solid transparent;
        }

        .oi-row:hover {
            background: rgba(255, 255, 255, 0.02);
        }

        .oi-row.round-number {
            background: var(--orange-dim);
            border-left-color: var(--orange);
        }

        .oi-row.atm {
            background: rgba(240, 185, 11, 0.08);
            border-left-color: var(--gold);
        }

        .oi-strike {
            width: 44px;
            text-align: right;
            color: var(--text-muted);
            font-weight: 500;
            font-size: 10px;
            flex-shrink: 0;
            font-variant-numeric: tabular-nums;
        }

        .oi-strike.round-number {
            color: var(--orange);
            font-weight: 800;
            font-size: 11px;
        }

        .oi-bars-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            margin-left: 8px;
            height: 16px;
            gap: 1px;
        }

        .oi-bar {
            height: 100%;
            min-width: 0;
            border-radius: 2px;
            transition: width 0.4s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .oi-bar-call {
            background: linear-gradient(90deg, var(--call-color), rgba(79, 195, 247, 0.6));
        }

        .oi-bar-put {
            background: linear-gradient(90deg, var(--put-color), rgba(255, 183, 77, 0.6));
        }

        .oi-total {
            width: 42px;
            text-align: right;
            font-size: 10px;
            color: var(--text-muted);
            flex-shrink: 0;
            margin-left: 6px;
            font-variant-numeric: tabular-nums;
            font-weight: 500;
        }

        .oi-total.high {
            color: var(--text-primary);
            font-weight: 700;
        }

        /* ===== CHART AREA ===== */
        .chart-area {
            position: relative;
            overflow: hidden;
            background: var(--bg-primary);
            min-width: 0;
            min-height: 0;
        }

        .chart-area .tradingview-widget-container,
        .chart-area .tradingview-widget-container__widget {
            position: absolute !important;
            inset: 0 !important;
            width: 100% !important;
            height: 100% !important;
        }

        .chart-area iframe {
            width: 100% !important;
            height: 100% !important;
            border: none !important;
        }

        /* ===== LEVELS PANEL (RIGHT) ===== */
        .levels-panel {
            background: var(--bg-secondary);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            z-index: 10;
        }

        .levels-header {
            padding: 12px 14px;
            border-bottom: 1px solid var(--border);
            font-size: 11px;
            font-weight: 700;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .levels-container {
            flex: 1;
            overflow-y: auto;
            padding: 4px 0;
        }

        .levels-container::-webkit-scrollbar {
            width: 3px;
        }

        .levels-container::-webkit-scrollbar-track {
            background: transparent;
        }

        .levels-container::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 2px;
        }

        .level-row {
            padding: 6px 14px;
            border-bottom: 1px solid rgba(42, 42, 62, 0.3);
            transition: background 0.15s;
        }

        .level-row:hover {
            background: rgba(255, 255, 255, 0.02);
        }

        .level-row.near-price {
            background: rgba(240, 185, 11, 0.06);
            border-left: 2px solid var(--gold);
        }

        .level-strike {
            font-size: 14px;
            font-weight: 800;
            color: var(--orange);
            font-variant-numeric: tabular-nums;
        }

        .level-expected {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 2px;
            font-variant-numeric: tabular-nums;
        }

        .level-vs {
            font-size: 10px;
            color: var(--cyan);
            margin-top: 1px;
            opacity: 0.7;
        }

        .level-oi-mini {
            display: flex;
            gap: 8px;
            margin-top: 3px;
            font-size: 10px;
        }

        .level-oi-mini span {
            font-variant-numeric: tabular-nums;
        }

        .level-call-val {
            color: var(--call-color);
        }

        .level-put-val {
            color: var(--put-color);
        }

        /* ===== INFO PANEL (BOTTOM) ===== */
        .info-panel {
            display: flex;
            align-items: center;
            padding: 8px 20px;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border);
            flex-shrink: 0;
            gap: 28px;
            font-size: 12px;
            flex-wrap: wrap;
        }

        .info-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .info-label {
            color: var(--text-muted);
            font-size: 11px;
        }

        .info-value {
            color: var(--text-primary);
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        .info-value.gold {
            color: var(--gold);
        }

        .info-value.cyan {
            color: var(--cyan);
        }

        .info-value.pink {
            color: var(--pink);
        }

        .info-value.green {
            color: var(--green);
        }

        .info-value.red {
            color: var(--red);
        }

        /* ===== LOADING ===== */
        .loading-overlay {
            position: fixed;
            inset: 0;
            background: rgba(12, 12, 20, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            transition: opacity 0.5s;
        }

        .loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .spinner {
            width: 44px;
            height: 44px;
            border: 3px solid var(--border);
            border-top-color: var(--gold);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .loading-text {
            margin-top: 14px;
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 500;
        }
    </style>
</head>

<body>

    <!-- Loading -->
    <div class="loading-overlay" id="loading">
        <div class="spinner"></div>
        <div class="loading-text">Fetching Vol2Vol Data...</div>
    </div>

    <!-- Header -->
    <div class="header">
        <div class="header-left">
            <div class="logo">⚡ Vol2Vol</div>
            <div class="contract-info">
                <span class="contract-name" id="contractName">Gold (GC)</span>
                <span class="contract-detail" id="contractDetail">—</span>

    <div class="main-container">

    <!-- Info Panel -->
    <div class="info-panel">
        <div class="info-item">
            <span class="info-label">Vol Settle (ATM):</span>
            <span class="info-value cyan" id="volSettleATM">—</span>
        </div>
        <div class="info-item">
            <span class="info-label">Expected Range:</span>

            <span class="info-label">P/C Ratio:</span>

    <!-- TradingView Widget Script -->
    <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js"
        async>
            {
                "autosize": true,
                    "symbol": "BLACKBULL:GOLD.F",
                        "interval": "60",
                            "timezone": "Asia/Bangkok",
                                "theme": "dark",
                                    "style": "1",
                                        "locale": "en",
                                            "hide_top_toolbar": false,
                                                "hide_legend": false,
                                                    "allow_symbol_change": true,
                                                        "save_image": true,
                                                            "calendar": false,
                                                                "support_host": "https://www.tradingview.com",
                                                                    "container_id": "tvWidget",
                                                                        "backgroundColor": "rgba(12, 12, 20, 1)",
                                                                            "gridColor": "rgba(42, 42, 62, 0.4)",
                                                                                "hide_volume": false
            }
        </script>

    <script>
        // ========== CONFIG ==========
        const CONFIG = {
            intradayUrl: 'https://raw.githubusercontent.com/pageth/Vol2VolData/main/IntradayData.txt',
            oiUrl: 'https://raw.githubusercontent.com/pageth/Vol2VolData/main/OIData.txt',
            roundNumberInterval: 25,
            refreshIntervalMs: 60000,
            visibleStrikeRange: 300,
            oiBarMaxWidth: 110,
        };

        // ========== STATE ==========
        let state = {
            intradayData: null,
            oiData: null,
            refreshTimer: null,
        };

        // ========== PARSE DATA ==========
        function parseVol2VolData(text) {
            const lines = text.trim().split('\n');
            if (lines.length < 2) return null;

            const header = lines[0];
            const dteMatch = header.match(/\(([\d.]+)\s*DTE\)/);
            const priceMatch = header.match(/vs\s+([\d.]+)/);
            const changeMatches = header.match(/\(([+-]?[\d.]+)\)/g);
            const typeMatch = header.match(/- (.+)$/);
            const contractMatch = header.match(/\)\s+(\S+)\s+\(/);

            const dte = dteMatch ? parseFloat(dteMatch[1]) : 0;
            const underlying = priceMatch ? parseFloat(priceMatch[1]) : 0;
            let change = 0;
            if (changeMatches && changeMatches.length >= 2) {
                const lastMatch = changeMatches[changeMatches.length - 1];
                change = parseFloat(lastMatch.replace(/[()]/g, ''));
            }
            const dataType = typeMatch ? typeMatch[1].trim() : '';
            const contract = contractMatch ? contractMatch[1] : '';

            const strikes = [];
            for (let i = 2; i < lines.length; i++) {
                const parts = lines[i].split(',');
                if (parts.length >= 4) {
                    strikes.push({
                        strike: parseFloat(parts[0]),
                        call: parseInt(parts[1]),
                        put: parseInt(parts[2]),
                        volSettle: parseFloat(parts[3]),
                        total: parseInt(parts[1]) + parseInt(parts[2]),
                    });
                }
            }

            return { header, dte, underlying, change, dataType, contract, strikes };
        }

        // ========== FETCH ==========
        async function fetchData() {
            try {
                const [intRes, oiRes] = await Promise.all([
                    fetch(CONFIG.intradayUrl + '?t=' + Date.now()),
                    fetch(CONFIG.oiUrl + '?t=' + Date.now()),
                ]);
                if (!intRes.ok || !oiRes.ok) throw new Error('Fetch failed');

                state.intradayData = parseVol2VolData(await intRes.text());
                state.oiData = parseVol2VolData(await oiRes.text());
                return true;
            } catch (e) {
                console.error('Fetch error:', e);
                return false;
            }
        }

        // ========== RENDER OI PANEL ==========
        function renderOIPanel(oiData) {
            const container = document.getElementById('oiContainer');
            if (!oiData?.strikes) {
                container.innerHTML = '<div style="padding:20px;color:var(--text-muted);text-align:center;font-size:12px">No OI data</div>';
                return;
            }

            const underlying = oiData.underlying;
            const interval = CONFIG.roundNumberInterval;

            const filtered = oiData.strikes.filter(s =>
                s.strike >= underlying - CONFIG.visibleStrikeRange &&
                s.strike <= underlying + CONFIG.visibleStrikeRange &&
                s.total > 0
            );

            const maxSingle = Math.max(...filtered.map(s => Math.max(s.call, s.put)), 1);
            const p90 = Math.max(...filtered.map(s => s.total).sort((a, b) => a - b).slice(0, Math.floor(filtered.length * 0.9)), 1);

            filtered.sort((a, b) => b.strike - a.strike);

            // Find closest strike to underlying
            let closestStrike = filtered.reduce((prev, curr) =>
                Math.abs(curr.strike - underlying) < Math.abs(prev.strike - underlying) ? curr : prev
                , filtered[0]);

            let html = '';
            for (const s of filtered) {
                const isRound = s.strike % interval === 0;
                const isATM = s === closestStrike;
                let classes = 'oi-row';
                if (isRound) classes += ' round-number';
                if (isATM) classes += ' atm';

                const callW = Math.max(0, (s.call / maxSingle) * CONFIG.oiBarMaxWidth);
                const putW = Math.max(0, (s.put / maxSingle) * CONFIG.oiBarMaxWidth);
                const isHigh = s.total > p90;

                html += `
                <div class="${classes}" title="Call: ${s.call} | Put: ${s.put}">
                    <span class="oi-strike ${isRound ? 'round-number' : ''}">${s.strike}</span>
                    <div class="oi-bars-wrapper">
                        ${s.call > 0 ? `<div class="oi-bar oi-bar-call" style="width:${callW}px"></div>` : ''}
                        ${s.put > 0 ? `<div class="oi-bar oi-bar-put" style="width:${putW}px"></div>` : ''}
                    </div>
                    <span class="oi-total ${isHigh ? 'high' : ''}">${s.total}</span>
                </div>
            `;
            }
            container.innerHTML = html;
        }

        // ========== RENDER LEVELS PANEL ==========
        function renderLevelsPanel(intradayData, oiData) {
            const container = document.getElementById('levelsContainer');
            const data = intradayData || oiData;
            if (!data?.strikes) {
                container.innerHTML = '<div style="padding:20px;color:var(--text-muted);text-align:center;font-size:12px">No data</div>';
                return;
            }

            const underlying = data.underlying;
            const dte = data.dte || 1;
            const interval = CONFIG.roundNumberInterval;

            // Build vol settle + OI maps
            const vsMap = {};
            if (intradayData?.strikes) {
                intradayData.strikes.forEach(s => { vsMap[s.strike] = s.volSettle; });
            }
            const oiMap = {};
            if (oiData?.strikes) {
                oiData.strikes.forEach(s => { oiMap[s.strike] = s; });
            }

            const minS = underlying - CONFIG.visibleStrikeRange;
            const maxS = underlying + CONFIG.visibleStrikeRange;
            let start = Math.ceil(minS / interval) * interval;

            let html = '';
            for (let strike = maxS; strike >= minS; strike -= interval) {
                // Snap to interval
                if (strike % interval !== 0) continue;

                // Interpolate vol settle
                let vs = vsMap[strike] || 0;
                if (vs === 0) {
                    const lo = Math.floor(strike / 5) * 5;
                    const hi = lo + 5;
                    const loVS = vsMap[lo] || 0;
                    const hiVS = vsMap[hi] || 0;
                    if (loVS > 0 && hiVS > 0) vs = loVS + (hiVS - loVS) * ((strike - lo) / 5);
                    else vs = loVS || hiVS;
                }

                const expMove = underlying * vs * Math.sqrt(dte / 365);
                const expLevel = underlying - expMove;

                const oi = oiMap[strike] || { call: 0, put: 0, total: 0 };
                // Check nearby OI if exact strike not in OI data
                let callOI = oi.call || 0;
                let putOI = oi.put || 0;

                const isNear = Math.abs(strike - underlying) <= 50;

                html += `
                <div class="level-row ${isNear ? 'near-price' : ''}">
                    <div class="level-strike">${strike}</div>
                    ${vs > 0 ? `<div class="level-expected">ExpRange: ${expLevel.toFixed(1)}</div>` : ''}
                    ${vs > 0 ? `<div class="level-vs">IV: ${(vs * 100).toFixed(1)}%</div>` : ''}
                    ${(callOI > 0 || putOI > 0) ? `
                        <div class="level-oi-mini">
                            <span class="level-call-val">C: ${callOI}</span>
                            <span class="level-put-val">P: ${putOI}</span>
                        </div>
                    ` : ''}
                </div>
            `;
            }
            container.innerHTML = html;
        }

        // ========== UPDATE HEADER & INFO ==========
        function updateUI(intradayData, oiData) {
            const data = oiData || intradayData;
            if (!data) return;

            document.getElementById('contractName').textContent = 'Gold (GC)';
            document.getElementById('contractDetail').textContent = data.contract || '';
            document.getElementById('priceDisplay').textContent = data.underlying.toFixed(1);

            const changeEl = document.getElementById('priceChange');
            const sign = data.change >= 0 ? '+' : '';
            changeEl.textContent = `${sign}${data.change.toFixed(1)}`;
            changeEl.className = `price-change ${data.change >= 0 ? 'up' : 'down'}`;

            document.getElementById('dteBadge').textContent = `DTE ${data.dte.toFixed(2)}`;
            document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString('th-TH');

            if (intradayData?.strikes) {
                let atm = intradayData.strikes.reduce((p, c) =>
                    Math.abs(c.strike - data.underlying) < Math.abs(p.strike - data.underlying) ? c : p
                );
                if (atm.volSettle > 0) {
                    document.getElementById('volSettleATM').textContent = (atm.volSettle * 100).toFixed(2) + '%';
                    const er = data.underlying * atm.volSettle * Math.sqrt(data.dte / 365);
                    document.getElementById('expectedRange').textContent =
                        `±${er.toFixed(1)} ($${(data.underlying - er).toFixed(0)} – $${(data.underlying + er).toFixed(0)})`;
                }
            }

            if (oiData?.strikes) {
                const maxOI = oiData.strikes.reduce((p, c) => c.total > p.total ? c : p);
                document.getElementById('maxOIStrike').textContent = `${maxOI.strike} (${maxOI.total})`;

                let tc = 0, tp = 0;
                oiData.strikes.forEach(s => { tc += s.call; tp += s.put; });
                document.getElementById('totalCallOI').textContent = tc.toLocaleString();
                document.getElementById('totalPutOI').textContent = tp.toLocaleString();
                document.getElementById('pcRatio').textContent = tc > 0 ? (tp / tc).toFixed(2) : '—';
            }
        }

        // ========== REFRESH ==========
        async function refreshData() {
            const btn = document.querySelector('.refresh-btn');
            btn.textContent = '⟳ Loading...';
            btn.disabled = true;

            const ok = await fetchData();
            if (ok) {
                renderOIPanel(state.oiData);
                renderLevelsPanel(state.intradayData, state.oiData);
                updateUI(state.intradayData, state.oiData);
            }

            btn.textContent = '⟳ Refresh';
            btn.disabled = false;
        }

        // ========== INIT ==========
        async function init() {
            const ok = await fetchData();
            if (ok) {
                renderOIPanel(state.oiData);
                renderLevelsPanel(state.intradayData, state.oiData);
                updateUI(state.intradayData, state.oiData);
            }
            document.getElementById('loading').classList.add('hidden');
            state.refreshTimer = setInterval(refreshData, CONFIG.refreshIntervalMs);
        }

        init();
    </script>
</body>

</html>
