<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gold Vol2Vol — Intraday Expected Range & OI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0c0c14;
            --bg-secondary: #12121c;
            --bg-panel: #181824;
            --border: #2a2a3e;
            --text-primary: #e8e8f0;
            --text-secondary: #9090a8;
            --text-muted: #606078;
            --gold: #f0b90b;
            --gold-glow: rgba(240, 185, 11, 0.2);
            --orange: #ff9800;
            --orange-dim: rgba(255, 152, 0, 0.15);
            --cyan: #00e5ff;
            --pink: #ff4081;
            --green: #00e676;
            --red: #ff1744;
            --call-color: #4fc3f7;
            --put-color: #ffb74d;
        }

        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ===== HEADER ===== */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 20px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            z-index: 100;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .logo {
            font-size: 20px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--gold), #ffd54f);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .contract-info {
            display: flex;
            align-items: center;
            gap: 14px;
            font-size: 13px;
        }

        .contract-name {
            color: var(--text-primary);
            font-weight: 700;
            font-size: 16px;
        }

        .contract-detail {
            color: var(--text-secondary);
            font-size: 12px;
        }

        .price-display {
            font-size: 22px;
            font-weight: 800;
            color: var(--gold);
            text-shadow: 0 0 20px var(--gold-glow);
        }

        .price-change {
            font-size: 13px;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 6px;
        }

        .price-change.up {
            color: var(--green);
            background: rgba(0, 230, 118, 0.1);
        }

        .price-change.down {
            color: var(--red);
            background: rgba(255, 23, 68, 0.1);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .dte-badge {
            background: rgba(0, 229, 255, 0.12);
            border: 1px solid rgba(0, 229, 255, 0.25);
            color: var(--cyan);
            padding: 4px 12px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 13px;
        }

        .refresh-btn {
            background: rgba(240, 185, 11, 0.12);
            border: 1px solid rgba(240, 185, 11, 0.3);
            color: var(--gold);
            padding: 7px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s;
        }

        .refresh-btn:hover {
            background: rgba(240, 185, 11, 0.25);
            border-color: var(--gold);
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--green);
            box-shadow: 0 0 8px rgba(0, 230, 118, 0.5);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.4;
            }
        }

        .last-update {
            font-size: 11px;
            color: var(--text-muted);
        }

        /* ===== MAIN 3-COLUMN LAYOUT ===== */
        .main-container {
            flex: 1;
            display: grid;
            grid-template-columns: 260px 1fr 210px;
            min-height: 0;
            overflow: hidden;
        }

        /* ===== OI PANEL (LEFT) ===== */
        .oi-panel {
            background: var(--bg-secondary);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .oi-panel-header {
            padding: 10px 12px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .oi-panel-title {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .oi-legend {
            display: flex;
            gap: 10px;
            font-size: 10px;
            font-weight: 600;
        }

        .oi-legend-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .oi-legend-dot {
            width: 8px;
            height: 8px;
            border-radius: 2px;
        }

        .oi-legend-dot.call {
            background: var(--call-color);
        }

        .oi-legend-dot.put {
            background: var(--put-color);
        }

        .oi-legend-call {
            color: var(--call-color);
        }

        .oi-legend-put {
            color: var(--put-color);
        }

        .oi-container {
            flex: 1;
            overflow-y: auto;
            padding: 2px 0;
        }

        .oi-container::-webkit-scrollbar {
            width: 3px;
        }

        .oi-container::-webkit-scrollbar-track {
            background: transparent;
        }

        .oi-container::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 2px;
        }

        .oi-row {
            display: flex;
            align-items: center;
            padding: 1px 10px;
            height: 24px;
            font-size: 11px;
            cursor: default;
            border-left: 2px solid transparent;
        }

        .oi-row:hover {
            background: rgba(255, 255, 255, 0.02);
        }

        .oi-row.atm {
            background: rgba(240, 185, 11, 0.08);
            border-left-color: var(--gold);
        }

        .oi-row.hot {
            background: rgba(255, 152, 0, 0.1);
            border-left-color: var(--orange);
        }

        .oi-strike {
            width: 44px;
            text-align: right;
            color: var(--text-muted);
            font-weight: 500;
            font-size: 10px;
            flex-shrink: 0;
            font-variant-numeric: tabular-nums;
        }

        .oi-strike.hot {
            color: var(--orange);
            font-weight: 800;
            font-size: 11px;
        }

        .oi-bars-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            margin-left: 8px;
            height: 16px;
            gap: 1px;
        }

        .oi-bar {
            height: 100%;
            min-width: 0;
            border-radius: 2px;
        }

        .oi-bar-call {
            background: linear-gradient(90deg, var(--call-color), rgba(79, 195, 247, 0.5));
        }

        .oi-bar-put {
            background: linear-gradient(90deg, var(--put-color), rgba(255, 183, 77, 0.5));
        }

        .oi-total {
            width: 42px;
            text-align: right;
            font-size: 10px;
            color: var(--text-muted);
            flex-shrink: 0;
            margin-left: 6px;
            font-variant-numeric: tabular-nums;
            font-weight: 500;
        }

        .oi-total.high {
            color: var(--text-primary);
            font-weight: 700;
        }

        /* ===== CHART (CENTER) — direct iframe ===== */
        .chart-area {
            position: relative;
            overflow: hidden;
            min-width: 0;
            min-height: 0;
        }

        .chart-area iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* ===== VOLUME PANEL (RIGHT) — same style as OI ===== */
        .vol-panel {
            background: var(--bg-secondary);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ===== INFO PANEL (BOTTOM) ===== */
        .info-panel {
            display: flex;
            align-items: center;
            padding: 8px 20px;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border);
            flex-shrink: 0;
            gap: 28px;
            font-size: 12px;
            flex-wrap: wrap;
            z-index: 100;
        }

        .info-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .info-label {
            color: var(--text-muted);
            font-size: 11px;
        }

        .info-value {
            color: var(--text-primary);
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        .info-value.gold {
            color: var(--gold);
        }

        .info-value.cyan {
            color: var(--cyan);
        }

        .info-value.pink {
            color: var(--pink);
        }

        /* ===== LOADING ===== */
        .loading-overlay {
            position: fixed;
            inset: 0;
            background: rgba(12, 12, 20, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            transition: opacity 0.5s;
        }

        .loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .spinner {
            width: 44px;
            height: 44px;
            border: 3px solid var(--border);
            border-top-color: var(--gold);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .loading-text {
            margin-top: 14px;
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 500;
        }
    </style>
</head>

<body>

    <!-- Loading -->
    <div class="loading-overlay" id="loading">
        <div class="spinner"></div>
        <div class="loading-text">Fetching Vol2Vol Data...</div>
    </div>

    <!-- Header -->
    <div class="header">
        <div class="header-left">
            <div class="logo">⚡ Vol2Vol</div>
            <div class="contract-info">
                <span class="contract-name" id="contractName">Gold (GC)</span>
                <span class="contract-detail" id="contractDetail">—</span>
                <span class="price-display" id="priceDisplay">—</span>
                <span class="price-change up" id="priceChange">—</span>
            </div>
        </div>
        <div class="header-right">
            <span class="dte-badge" id="dteBadge">DTE —</span>
            <button class="refresh-btn" onclick="refreshData()">⟳ Refresh</button>
            <div class="status-indicator">
                <div class="status-dot" id="statusDot"></div>
                <span class="last-update" id="lastUpdate">—</span>
            </div>
        </div>
    </div>

    <!-- ===== MAIN 3-COLUMN ===== -->
    <div class="main-container">

        <!-- LEFT: OI Panel -->
        <div class="oi-panel">
            <div class="oi-panel-header">
                <span class="oi-panel-title">Open Interest</span>
                <div class="oi-legend">
                    <div class="oi-legend-item">
                        <div class="oi-legend-dot call"></div><span class="oi-legend-call">Call</span>
                    </div>
                    <div class="oi-legend-item">
                        <div class="oi-legend-dot put"></div><span class="oi-legend-put">Put</span>
                    </div>
                </div>
            </div>
            <div class="oi-container" id="oiContainer">
                <div style="padding:20px;color:var(--text-muted);text-align:center;font-size:12px">Loading OI...</div>
            </div>
        </div>

        <!-- CENTER: TradingView Chart (direct iframe) -->
        <div class="chart-area">
            <iframe
                src="https://www.tradingview.com/widgetembed/?hideideas=1&overrides=%7B%7D&enabled_features=%5B%5D&disabled_features=%5B%5D&locale=en#%7B%22symbol%22%3A%22BLACKBULL%3AGOLD.F%22%2C%22frameElementId%22%3A%22tvFrame%22%2C%22interval%22%3A%2260%22%2C%22hide_top_toolbar%22%3A%220%22%2C%22hide_legend%22%3A%220%22%2C%22save_image%22%3A%221%22%2C%22studies%22%3A%5B%5D%2C%22theme%22%3A%22dark%22%2C%22style%22%3A%221%22%2C%22timezone%22%3A%22Asia%2FBangkok%22%2C%22studies_overrides%22%3A%7B%7D%7D"
                allowtransparency="true" allowfullscreen>
            </iframe>
        </div>

        <!-- RIGHT: Levels Panel -->
        <!-- RIGHT: Intraday Volume Panel -->
        <div class="vol-panel">
            <div class="oi-panel-header">
                <span class="oi-panel-title">Intraday Volume</span>
                <div class="oi-legend">
                    <div class="oi-legend-item">
                        <div class="oi-legend-dot call"></div><span class="oi-legend-call">Call</span>
                    </div>
                    <div class="oi-legend-item">
                        <div class="oi-legend-dot put"></div><span class="oi-legend-put">Put</span>
                    </div>
                </div>
            </div>
            <div class="oi-container" id="volContainer">
                <div style="padding:20px;color:var(--text-muted);text-align:center;font-size:12px">Loading Vol...</div>
            </div>
        </div>

    </div>

    <!-- Info Panel -->
    <div class="info-panel">
        <div class="info-item"><span class="info-label">Vol Settle (ATM):</span><span class="info-value cyan"
                id="volSettleATM">—</span></div>
        <div class="info-item"><span class="info-label">Expected Range:</span><span class="info-value gold"
                id="expectedRange">—</span></div>
        <div class="info-item"><span class="info-label">Max OI Strike:</span><span class="info-value pink"
                id="maxOIStrike">—</span></div>
        <div class="info-item"><span class="info-label">Total Call OI:</span><span class="info-value"
                id="totalCallOI">—</span></div>
        <div class="info-item"><span class="info-label">Total Put OI:</span><span class="info-value"
                id="totalPutOI">—</span></div>
        <div class="info-item"><span class="info-label">P/C Ratio:</span><span class="info-value" id="pcRatio">—</span>
        </div>
    </div>

    <script>
        // ========== CONFIG ==========
        const CONFIG = {
            intradayUrl: 'https://raw.githubusercontent.com/pageth/Vol2VolData/main/IntradayData.txt',
            oiUrl: 'https://raw.githubusercontent.com/pageth/Vol2VolData/main/OIData.txt',
            roundNumberInterval: 25,
            refreshIntervalMs: 60000,
            visibleStrikeRange: 300,
            oiBarMaxWidth: 110,
        };

        let state = { intradayData: null, oiData: null, refreshTimer: null };

        // ========== PARSE ==========
        function parseVol2VolData(text) {
            const lines = text.trim().split('\n');
            if (lines.length < 2) return null;
            const header = lines[0];
            const dteMatch = header.match(/\(([\d.]+)\s*DTE\)/);
            const priceMatch = header.match(/vs\s+([\d.]+)/);
            const changeMatches = header.match(/\(([+-]?[\d.]+)\)/g);
            const typeMatch = header.match(/- (.+)$/);
            const contractMatch = header.match(/\)\s+(\S+)\s+\(/);
            const dte = dteMatch ? parseFloat(dteMatch[1]) : 0;
            const underlying = priceMatch ? parseFloat(priceMatch[1]) : 0;
            let change = 0;
            if (changeMatches && changeMatches.length >= 2) {
                change = parseFloat(changeMatches[changeMatches.length - 1].replace(/[()]/g, ''));
            }
            const dataType = typeMatch ? typeMatch[1].trim() : '';
            const contract = contractMatch ? contractMatch[1] : '';
            const strikes = [];
            for (let i = 2; i < lines.length; i++) {
                const p = lines[i].split(',');
                if (p.length >= 4) {
                    strikes.push({ strike: parseFloat(p[0]), call: parseInt(p[1]), put: parseInt(p[2]), volSettle: parseFloat(p[3]), total: parseInt(p[1]) + parseInt(p[2]) });
                }
            }
            return { header, dte, underlying, change, dataType, contract, strikes };
        }

        // ========== FETCH ==========
        async function fetchData() {
            try {
                const [intRes, oiRes] = await Promise.all([
                    fetch(CONFIG.intradayUrl + '?t=' + Date.now()),
                    fetch(CONFIG.oiUrl + '?t=' + Date.now()),
                ]);
                if (!intRes.ok || !oiRes.ok) throw new Error('Fetch failed');
                state.intradayData = parseVol2VolData(await intRes.text());
                state.oiData = parseVol2VolData(await oiRes.text());
                return true;
            } catch (e) { console.error('Fetch error:', e); return false; }
        }

        // ========== RENDER BARS (shared for both panels) ==========
        function renderBarsPanel(containerId, data, maxWidth, hotThreshold) {
            const container = document.getElementById(containerId);
            if (!data?.strikes) { container.innerHTML = '<div style="padding:20px;color:var(--text-muted);text-align:center;font-size:12px">No data</div>'; return; }
            const underlying = data.underlying;
            const filtered = data.strikes.filter(s => s.strike >= underlying - CONFIG.visibleStrikeRange && s.strike <= underlying + CONFIG.visibleStrikeRange && s.total > 0);
            if (filtered.length === 0) { container.innerHTML = '<div style="padding:20px;color:var(--text-muted);text-align:center;font-size:12px">No data in range</div>'; return; }
            const maxSingle = Math.max(...filtered.map(s => Math.max(s.call, s.put)), 1);
            filtered.sort((a, b) => b.strike - a.strike);
            let closestStrike = filtered.reduce((prev, curr) => Math.abs(curr.strike - underlying) < Math.abs(prev.strike - underlying) ? curr : prev, filtered[0]);
            let html = '';
            for (const s of filtered) {
                const isATM = s === closestStrike;
                const isHot = s.total >= hotThreshold;
                let cls = 'oi-row';
                if (isATM) cls += ' atm';
                else if (isHot) cls += ' hot';
                const callW = Math.max(0, (s.call / maxSingle) * maxWidth);
                const putW = Math.max(0, (s.put / maxSingle) * maxWidth);
                html += `<div class="${cls}" title="Call: ${s.call} | Put: ${s.put}"><span class="oi-strike ${isHot ? 'hot' : ''}">${s.strike}</span><div class="oi-bars-wrapper">${s.call > 0 ? `<div class="oi-bar oi-bar-call" style="width:${callW}px"></div>` : ''}${s.put > 0 ? `<div class="oi-bar oi-bar-put" style="width:${putW}px"></div>` : ''}</div><span class="oi-total ${isHot ? 'high' : ''}">${s.total}</span></div>`;
            }
            container.innerHTML = html;
        }

        function renderOIPanel(oiData) { renderBarsPanel('oiContainer', oiData, CONFIG.oiBarMaxWidth, 100); }
        function renderVolPanel(intradayData) { renderBarsPanel('volContainer', intradayData, CONFIG.oiBarMaxWidth, 80); }

        // ========== UPDATE UI ==========
        function updateUI(intradayData, oiData) {
            const data = oiData || intradayData; if (!data) return;
            document.getElementById('contractName').textContent = 'Gold (GC)';
            document.getElementById('contractDetail').textContent = data.contract || '';
            document.getElementById('priceDisplay').textContent = data.underlying.toFixed(1);
            const ce = document.getElementById('priceChange');
            ce.textContent = `${data.change >= 0 ? '+' : ''}${data.change.toFixed(1)}`;
            ce.className = `price-change ${data.change >= 0 ? 'up' : 'down'}`;
            document.getElementById('dteBadge').textContent = `DTE ${data.dte.toFixed(2)}`;
            document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString('th-TH');
            if (intradayData?.strikes) {
                let atm = intradayData.strikes.reduce((p, c) => Math.abs(c.strike - data.underlying) < Math.abs(p.strike - data.underlying) ? c : p);
                if (atm.volSettle > 0) {
                    document.getElementById('volSettleATM').textContent = (atm.volSettle * 100).toFixed(2) + '%';
                    const er = data.underlying * atm.volSettle * Math.sqrt(data.dte / 365);
                    document.getElementById('expectedRange').textContent = `±${er.toFixed(1)} ($${(data.underlying - er).toFixed(0)} – $${(data.underlying + er).toFixed(0)})`;
                }
            }
            if (oiData?.strikes) {
                const mx = oiData.strikes.reduce((p, c) => c.total > p.total ? c : p);
                document.getElementById('maxOIStrike').textContent = `${mx.strike} (${mx.total})`;
                let tc = 0, tp = 0; oiData.strikes.forEach(s => { tc += s.call; tp += s.put; });
                document.getElementById('totalCallOI').textContent = tc.toLocaleString();
                document.getElementById('totalPutOI').textContent = tp.toLocaleString();
                document.getElementById('pcRatio').textContent = tc > 0 ? (tp / tc).toFixed(2) : '—';
            }
        }

        // ========== REFRESH ==========
        async function refreshData() {
            const btn = document.querySelector('.refresh-btn');
            btn.textContent = '⟳ Loading...'; btn.disabled = true;
            const ok = await fetchData();
            if (ok) { renderOIPanel(state.oiData); renderVolPanel(state.intradayData); updateUI(state.intradayData, state.oiData); }
            btn.textContent = '⟳ Refresh'; btn.disabled = false;
        }

        // ========== INIT ==========
        async function init() {
            const ok = await fetchData();
            if (ok) { renderOIPanel(state.oiData); renderVolPanel(state.intradayData); updateUI(state.intradayData, state.oiData); }
            document.getElementById('loading').classList.add('hidden');
            state.refreshTimer = setInterval(refreshData, CONFIG.refreshIntervalMs);
        }
        init();
    </script>
</body>

</html>
