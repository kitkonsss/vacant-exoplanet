<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gold Vol2Vol Dashboard — OI & Intraday Volume</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0a12;
            --bg-secondary: #10101a;
            --bg-panel: #161622;
            --bg-card: #1a1a2a;
            --border: #252540;
            --border-active: #3a3a60;
            --text-primary: #e8e8f0;
            --text-secondary: #9090a8;
            --text-muted: #606078;
            --gold: #f0b90b;
            --gold-glow: rgba(240, 185, 11, 0.25);
            --orange: #ff9800;
            --orange-dim: rgba(255, 152, 0, 0.12);
            --cyan: #00e5ff;
            --pink: #ff4081;
            --green: #00e676;
            --red: #ff1744;
            --call-color: #4fc3f7;
            --call-bg: rgba(79, 195, 247, 0.08);
            --put-color: #ffb74d;
            --put-bg: rgba(255, 183, 77, 0.08);
        }

        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ===== HEADER ===== */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 24px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            z-index: 100;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .logo {
            font-size: 20px;
            font-weight: 900;
            background: linear-gradient(135deg, var(--gold), #ffd54f);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .contract-info {
            display: flex;
            align-items: center;
            gap: 14px;
            font-size: 13px;
        }

        .contract-name {
            color: var(--text-primary);
            font-weight: 700;
            font-size: 16px;
        }

        .contract-detail {
            color: var(--text-secondary);
            font-size: 12px;
        }

        .price-display {
            font-size: 22px;
            font-weight: 800;
            color: var(--gold);
            text-shadow: 0 0 20px var(--gold-glow);
        }

        .price-change {
            font-size: 13px;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 6px;
        }

        .price-change.up {
            color: var(--green);
            background: rgba(0, 230, 118, 0.1);
        }

        .price-change.down {
            color: var(--red);
            background: rgba(255, 23, 68, 0.1);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .dte-badge {
            background: rgba(0, 229, 255, 0.12);
            border: 1px solid rgba(0, 229, 255, 0.25);
            color: var(--cyan);
            padding: 4px 12px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 13px;
        }

        .refresh-btn {
            background: rgba(240, 185, 11, 0.12);
            border: 1px solid rgba(240, 185, 11, 0.3);
            color: var(--gold);
            padding: 7px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s;
        }

        .refresh-btn:hover {
            background: rgba(240, 185, 11, 0.25);
            border-color: var(--gold);
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--green);
            box-shadow: 0 0 8px rgba(0, 230, 118, 0.5);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.4;
            }
        }

        .last-update {
            font-size: 11px;
            color: var(--text-muted);
        }

        /* ===== TABS ===== */
        .tab-bar {
            display: flex;
            gap: 0;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            padding: 0 24px;
            flex-shrink: 0;
        }

        .tab-btn {
            padding: 10px 22px;
            font-size: 12px;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
            color: var(--text-muted);
            background: none;
            border: none;
            border-bottom: 2px solid transparent;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .tab-btn:hover {
            color: var(--text-secondary);
            background: rgba(255, 255, 255, 0.02);
        }

        .tab-btn.active {
            color: var(--gold);
            border-bottom-color: var(--gold);
        }

        .tab-btn .tab-dte {
            font-size: 10px;
            font-weight: 500;
            color: var(--text-muted);
            margin-left: 6px;
        }

        .tab-btn.active .tab-dte {
            color: var(--gold);
            opacity: 0.7;
        }

        /* ===== SUMMARY STRIP ===== */
        .summary-strip {
            display: flex;
            gap: 0;
            background: var(--bg-panel);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            overflow-x: auto;
        }

        .summary-card {
            flex: 1;
            min-width: 140px;
            padding: 12px 18px;
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .summary-card:last-child {
            border-right: none;
        }

        .summary-label {
            font-size: 10px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .summary-value {
            font-size: 16px;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
        }

        .summary-sub {
            font-size: 11px;
            color: var(--text-muted);
            font-variant-numeric: tabular-nums;
        }

        .val-gold {
            color: var(--gold);
        }

        .val-cyan {
            color: var(--cyan);
        }

        .val-pink {
            color: var(--pink);
        }

        .val-green {
            color: var(--green);
        }

        .val-orange {
            color: var(--orange);
        }

        /* ===== MAIN 2-COLUMN ===== */
        .main-container {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            min-height: 0;
            overflow: hidden;
        }

        /* ===== PANEL ===== */
        .data-panel {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .data-panel:first-child {
            border-right: 1px solid var(--border);
        }

        .panel-header {
            padding: 10px 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-secondary);
        }

        .panel-title {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .panel-legend {
            display: flex;
            gap: 12px;
            font-size: 10px;
            font-weight: 600;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .legend-dot {
            width: 8px;
            height: 8px;
            border-radius: 2px;
        }

        .legend-dot.call {
            background: var(--call-color);
        }

        .legend-dot.put {
            background: var(--put-color);
        }

        .legend-call {
            color: var(--call-color);
        }

        .legend-put {
            color: var(--put-color);
        }

        .data-rows {
            flex: 1;
            overflow-y: auto;
            padding: 2px 0;
        }

        .data-rows::-webkit-scrollbar {
            width: 4px;
        }

        .data-rows::-webkit-scrollbar-track {
            background: transparent;
        }

        .data-rows::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 2px;
        }

        /* ===== ROW ===== */
        .row {
            display: flex;
            align-items: center;
            padding: 1px 14px;
            height: 26px;
            font-size: 11px;
            cursor: default;
            border-left: 3px solid transparent;
            transition: background 0.1s;
        }

        .row:hover {
            background: rgba(255, 255, 255, 0.02);
        }

        .row.atm {
            background: rgba(240, 185, 11, 0.08);
            border-left-color: var(--gold);
        }

        .row.hot {
            background: var(--orange-dim);
            border-left-color: var(--orange);
        }

        .row-strike {
            width: 48px;
            text-align: right;
            color: var(--text-muted);
            font-weight: 500;
            font-size: 11px;
            flex-shrink: 0;
            font-variant-numeric: tabular-nums;
        }

        .row-strike.hot {
            color: var(--orange);
            font-weight: 800;
        }

        .row-strike.atm {
            color: var(--gold);
            font-weight: 800;
        }

        .row-bars {
            flex: 1;
            display: flex;
            align-items: center;
            margin: 0 10px;
            height: 18px;
            gap: 1px;
        }

        .bar {
            height: 100%;
            min-width: 0;
            border-radius: 2px;
        }

        .bar-call {
            background: linear-gradient(90deg, var(--call-color), rgba(79, 195, 247, 0.4));
        }

        .bar-put {
            background: linear-gradient(90deg, var(--put-color), rgba(255, 183, 77, 0.4));
        }

        .row-call {
            width: 42px;
            text-align: right;
            font-size: 10px;
            color: var(--call-color);
            flex-shrink: 0;
            font-variant-numeric: tabular-nums;
            font-weight: 500;
            opacity: 0.7;
        }

        .row-put {
            width: 42px;
            text-align: right;
            font-size: 10px;
            color: var(--put-color);
            flex-shrink: 0;
            font-variant-numeric: tabular-nums;
            font-weight: 500;
            opacity: 0.7;
        }

        .row-total {
            width: 44px;
            text-align: right;
            font-size: 10px;
            color: var(--text-muted);
            flex-shrink: 0;
            margin-left: 4px;
            font-variant-numeric: tabular-nums;
            font-weight: 500;
        }

        .row-total.high {
            color: var(--text-primary);
            font-weight: 700;
        }

        /* ===== PLACEHOLDER ===== */
        .placeholder-msg {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 30px;
            text-align: center;
            color: var(--text-muted);
            gap: 10px;
        }

        .placeholder-msg .icon {
            font-size: 36px;
            opacity: 0.5;
        }

        .placeholder-msg .title {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-secondary);
        }

        .placeholder-msg .desc {
            font-size: 12px;
            max-width: 320px;
            line-height: 1.6;
        }

        /* ===== LOADING ===== */
        .loading-overlay {
            position: fixed;
            inset: 0;
            background: rgba(10, 10, 18, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            transition: opacity 0.5s;
        }

        .loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .spinner {
            width: 44px;
            height: 44px;
            border: 3px solid var(--border);
            border-top-color: var(--gold);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .loading-text {
            margin-top: 14px;
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 500;
        }

        /* ===== INFO FOOTER ===== */
        .info-footer {
            display: flex;
            align-items: center;
            padding: 6px 24px;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border);
            flex-shrink: 0;
            gap: 24px;
            font-size: 11px;
            flex-wrap: wrap;
        }

        .info-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .info-label {
            color: var(--text-muted);
        }

        .info-value {
            color: var(--text-primary);
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }
    </style>
</head>

<body>

    <!-- Loading -->
    <div class="loading-overlay" id="loading">
        <div class="spinner"></div>
        <div class="loading-text">Fetching Vol2Vol Data...</div>
    </div>

    <!-- Header -->
    <div class="header">
        <div class="header-left">
            <div class="logo">⚡ Vol2Vol</div>
            <div class="contract-info">
                <span class="contract-name" id="contractName">Gold (GC)</span>
                <span class="contract-detail" id="contractDetail">—</span>
                <span class="price-display" id="priceDisplay">—</span>
                <span class="price-change up" id="priceChange">—</span>
            </div>
        </div>
        <div class="header-right">
            <span class="dte-badge" id="dteBadge">DTE —</span>
            <button class="refresh-btn" onclick="refreshData()">⟳ Refresh</button>
            <div class="status-indicator">
                <div class="status-dot" id="statusDot"></div>
                <span class="last-update" id="lastUpdate">—</span>
            </div>
        </div>
    </div>

    <!-- Contract Tabs -->
    <div class="tab-bar">
        <button class="tab-btn active" data-tab="current" onclick="switchTab('current')">
            Current <span class="tab-dte" id="tabDteCurrent"></span>
        </button>
        <button class="tab-btn" data-tab="friday" onclick="switchTab('friday')">
            Friday <span class="tab-dte" id="tabDteFriday"></span>
        </button>
        <button class="tab-btn" data-tab="monthly" onclick="switchTab('monthly')">
            Monthly <span class="tab-dte" id="tabDteMonthly"></span>
        </button>
    </div>

    <!-- Summary Strip -->
    <div class="summary-strip" id="summaryStrip">
        <div class="summary-card">
            <span class="summary-label">Vol Settle (ATM)</span>
            <span class="summary-value val-cyan" id="sumVolSettle">—</span>
        </div>
        <div class="summary-card">
            <span class="summary-label">Expected Range</span>
            <span class="summary-value val-gold" id="sumExpRange">—</span>
            <span class="summary-sub" id="sumExpRangePrices"></span>
        </div>
        <div class="summary-card">
            <span class="summary-label">Max OI Strike</span>
            <span class="summary-value val-pink" id="sumMaxOI">—</span>
            <span class="summary-sub" id="sumMaxOIDetail"></span>
        </div>
        <div class="summary-card">
            <span class="summary-label">Total Call OI</span>
            <span class="summary-value val-cyan" id="sumTotalCall">—</span>
        </div>
        <div class="summary-card">
            <span class="summary-label">Total Put OI</span>
            <span class="summary-value val-orange" id="sumTotalPut">—</span>
        </div>
        <div class="summary-card">
            <span class="summary-label">P/C Ratio</span>
            <span class="summary-value" id="sumPCRatio">—</span>
        </div>
    </div>

    <!-- ===== MAIN 2-COL ===== -->
    <div class="main-container" id="mainContainer">

        <!-- LEFT: OI Panel -->
        <div class="data-panel">
            <div class="panel-header">
                <span class="panel-title">Open Interest</span>
                <div class="panel-legend">
                    <div class="legend-item">
                        <div class="legend-dot call"></div><span class="legend-call">Call</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-dot put"></div><span class="legend-put">Put</span>
                    </div>
                </div>
            </div>
            <div class="data-rows" id="oiContainer">
                <div class="placeholder-msg">
                    <div class="icon">📊</div>
                    <div class="desc">Loading OI data...</div>
                </div>
            </div>
        </div>

        <!-- RIGHT: Intraday Volume Panel -->
        <div class="data-panel">
            <div class="panel-header">
                <span class="panel-title">Intraday Volume</span>
                <div class="panel-legend">
                    <div class="legend-item">
                        <div class="legend-dot call"></div><span class="legend-call">Call</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-dot put"></div><span class="legend-put">Put</span>
                    </div>
                </div>
            </div>
            <div class="data-rows" id="volContainer">
                <div class="placeholder-msg">
                    <div class="icon">📊</div>
                    <div class="desc">Loading Volume data...</div>
                </div>
            </div>
        </div>

    </div>

    <!-- Info Footer -->
    <div class="info-footer">
        <div class="info-item"><span class="info-label">Source:</span><span class="info-value">pageth/Vol2VolData</span>
        </div>
        <div class="info-item"><span class="info-label">Contract:</span><span class="info-value"
                id="footerContract">—</span></div>
        <div class="info-item"><span class="info-label">Data Type:</span><span class="info-value"
                id="footerDataType">—</span></div>
    </div>

    <script>
        // ========== CONFIG ==========
        const PAGETH_BASE = 'https://raw.githubusercontent.com/pageth/Vol2VolData/main';
        const MY_BASE = 'https://raw.githubusercontent.com/kitkonsss/atas/main/data';

        const CONFIG = {
            contracts: {
                current: {
                    label: 'Current',
                    intradayUrl: PAGETH_BASE + '/IntradayData.txt',
                    oiUrl: PAGETH_BASE + '/OIData.txt',
                },
                friday: {
                    label: 'Friday',
                    intradayUrl: './data/friday_IntradayData.txt',
                    oiUrl: './data/friday_OIData.txt',
                },
                monthly: {
                    label: 'Monthly',
                    intradayUrl: './data/monthly_IntradayData.txt',
                    oiUrl: './data/monthly_OIData.txt',
                },
            },
            refreshIntervalMs: 60000,
            visibleStrikeRange: 300,
            barMaxWidth: 160,
            oiHotThreshold: 100,
            volHotThreshold: 80,
        };

        let state = {
            activeTab: 'current',
            data: { current: {}, friday: {}, monthly: {} },
            refreshTimer: null,
        };

        // ========== PARSE ==========
        function parseVol2VolData(text) {
            const lines = text.trim().split('\n');
            if (lines.length < 2) return null;
            const header = lines[0];
            const dteMatch = header.match(/\(([\d.]+)\s*DTE\)/);
            const priceMatch = header.match(/vs\s+([\d.]+)/);
            const changeMatches = header.match(/\(([+-]?[\d.]+)\)/g);
            const typeMatch = header.match(/- (.+)$/);
            const contractMatch = header.match(/\)\s+(\S+)\s+\(/);
            const dte = dteMatch ? parseFloat(dteMatch[1]) : 0;
            const underlying = priceMatch ? parseFloat(priceMatch[1]) : 0;
            let change = 0;
            if (changeMatches && changeMatches.length >= 2) {
                change = parseFloat(changeMatches[changeMatches.length - 1].replace(/[()]/g, ''));
            }
            const dataType = typeMatch ? typeMatch[1].trim() : '';
            const contract = contractMatch ? contractMatch[1] : '';
            const strikes = [];
            for (let i = 2; i < lines.length; i++) {
                const p = lines[i].split(',');
                if (p.length >= 4) {
                    strikes.push({
                        strike: parseFloat(p[0]),
                        call: parseInt(p[1]),
                        put: parseInt(p[2]),
                        volSettle: parseFloat(p[3]),
                        total: parseInt(p[1]) + parseInt(p[2]),
                    });
                }
            }
            return { header, dte, underlying, change, dataType, contract, strikes };
        }

        // ========== FETCH ==========
        async function fetchTabData(tabKey) {
            const cfg = CONFIG.contracts[tabKey];
            if (!cfg.intradayUrl && !cfg.oiUrl) {
                state.data[tabKey] = { intraday: null, oi: null };
                return;
            }
            try {
                const ts = Date.now();
                const promises = [];
                promises.push(cfg.intradayUrl ? fetch(cfg.intradayUrl + '?t=' + ts) : Promise.resolve(null));
                promises.push(cfg.oiUrl ? fetch(cfg.oiUrl + '?t=' + ts) : Promise.resolve(null));
                const [intRes, oiRes] = await Promise.all(promises);
                state.data[tabKey] = {
                    intraday: intRes?.ok ? parseVol2VolData(await intRes.text()) : null,
                    oi: oiRes?.ok ? parseVol2VolData(await oiRes.text()) : null,
                };
            } catch (e) {
                console.error(`Fetch error (${tabKey}):`, e);
            }
        }

        // ========== RENDER ROWS ==========
        function renderPanel(containerId, data, hotThreshold) {
            const container = document.getElementById(containerId);
            if (!data?.strikes) {
                container.innerHTML = '<div class="placeholder-msg"><div class="icon">📊</div><div class="desc">No data available</div></div>';
                return;
            }
            const underlying = data.underlying;
            const filtered = data.strikes.filter(s =>
                s.strike >= underlying - CONFIG.visibleStrikeRange &&
                s.strike <= underlying + CONFIG.visibleStrikeRange &&
                s.total > 0
            );
            if (filtered.length === 0) {
                container.innerHTML = '<div class="placeholder-msg"><div class="icon">📭</div><div class="desc">No data in visible range</div></div>';
                return;
            }
            const maxSingle = Math.max(...filtered.map(s => Math.max(s.call, s.put)), 1);
            filtered.sort((a, b) => b.strike - a.strike);
            const closestStrike = filtered.reduce((prev, curr) =>
                Math.abs(curr.strike - underlying) < Math.abs(prev.strike - underlying) ? curr : prev, filtered[0]);

            let html = '';
            for (const s of filtered) {
                const isATM = s === closestStrike;
                const isHot = !isATM && s.total >= hotThreshold;
                let rowCls = 'row';
                if (isATM) rowCls += ' atm';
                else if (isHot) rowCls += ' hot';

                let strikeCls = 'row-strike';
                if (isATM) strikeCls += ' atm';
                else if (isHot) strikeCls += ' hot';

                const callW = Math.max(0, (s.call / maxSingle) * CONFIG.barMaxWidth);
                const putW = Math.max(0, (s.put / maxSingle) * CONFIG.barMaxWidth);

                html += `<div class="${rowCls}" title="Strike: ${s.strike} | Call: ${s.call} | Put: ${s.put}">` +
                    `<span class="${strikeCls}">${s.strike}</span>` +
                    `<span class="row-call">${s.call > 0 ? s.call : ''}</span>` +
                    `<div class="row-bars">` +
                    `${s.call > 0 ? `<div class="bar bar-call" style="width:${callW}px"></div>` : ''}` +
                    `${s.put > 0 ? `<div class="bar bar-put" style="width:${putW}px"></div>` : ''}` +
                    `</div>` +
                    `<span class="row-put">${s.put > 0 ? s.put : ''}</span>` +
                    `<span class="row-total ${isHot || (isATM && s.total >= hotThreshold) ? 'high' : ''}">${s.total}</span>` +
                    `</div>`;
            }
            container.innerHTML = html;
        }

        // ========== UPDATE SUMMARY ==========
        function updateSummary(intraday, oi) {
            const data = oi || intraday;
            if (!data) return;

            // Header info
            document.getElementById('contractName').textContent = 'Gold (GC)';
            document.getElementById('contractDetail').textContent = data.contract || '';
            document.getElementById('priceDisplay').textContent = data.underlying.toFixed(1);
            const ce = document.getElementById('priceChange');
            ce.textContent = `${data.change >= 0 ? '+' : ''}${data.change.toFixed(1)}`;
            ce.className = `price-change ${data.change >= 0 ? 'up' : 'down'}`;
            document.getElementById('dteBadge').textContent = `DTE ${data.dte.toFixed(2)}`;
            document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString('th-TH');
            document.getElementById('footerContract').textContent = data.contract || '';

            // Vol Settle & Expected Range
            if (intraday?.strikes) {
                const atm = intraday.strikes.reduce((p, c) =>
                    Math.abs(c.strike - data.underlying) < Math.abs(p.strike - data.underlying) ? c : p);
                if (atm.volSettle > 0) {
                    document.getElementById('sumVolSettle').textContent = (atm.volSettle * 100).toFixed(2) + '%';
                    const er = data.underlying * atm.volSettle * Math.sqrt(data.dte / 365);
                    document.getElementById('sumExpRange').textContent = `±${er.toFixed(1)}`;
                    document.getElementById('sumExpRangePrices').textContent =
                        `$${(data.underlying - er).toFixed(0)} – $${(data.underlying + er).toFixed(0)}`;
                }
                document.getElementById('footerDataType').textContent = intraday.dataType || '';
            }

            // OI stats
            if (oi?.strikes) {
                const mx = oi.strikes.reduce((p, c) => c.total > p.total ? c : p);
                document.getElementById('sumMaxOI').textContent = mx.strike.toString();
                document.getElementById('sumMaxOIDetail').textContent = `Total: ${mx.total} (C:${mx.call} P:${mx.put})`;
                let tc = 0, tp = 0;
                oi.strikes.forEach(s => { tc += s.call; tp += s.put; });
                document.getElementById('sumTotalCall').textContent = tc.toLocaleString();
                document.getElementById('sumTotalPut').textContent = tp.toLocaleString();
                document.getElementById('sumPCRatio').textContent = tc > 0 ? (tp / tc).toFixed(2) : '—';
            }
        }

        // ========== TAB SWITCH ==========
        function switchTab(tabKey) {
            state.activeTab = tabKey;
            document.querySelectorAll('.tab-btn').forEach(b => {
                b.classList.toggle('active', b.dataset.tab === tabKey);
            });
            renderActiveTab();
        }

        function renderActiveTab() {
            const tabData = state.data[state.activeTab];
            if (!tabData || (!tabData.intraday && !tabData.oi)) {
                // Show placeholder
                const oiC = document.getElementById('oiContainer');
                const volC = document.getElementById('volContainer');
                oiC.innerHTML = `<div class="placeholder-msg"><div class="icon">🔒</div><div class="title">No Data Yet</div><div class="desc">This contract requires a QuikStrike scraper. Set up the Python scraper to fetch ${CONFIG.contracts[state.activeTab].label} contract data.</div></div>`;
                volC.innerHTML = `<div class="placeholder-msg"><div class="icon">🔒</div><div class="title">No Data Yet</div><div class="desc">Configure the scraper to populate ${CONFIG.contracts[state.activeTab].label} contract Intraday Volume.</div></div>`;

                // Clear summary
                ['sumVolSettle', 'sumExpRange', 'sumMaxOI', 'sumTotalCall', 'sumTotalPut', 'sumPCRatio'].forEach(id => {
                    document.getElementById(id).textContent = '—';
                });
                document.getElementById('sumExpRangePrices').textContent = '';
                document.getElementById('sumMaxOIDetail').textContent = '';
                return;
            }
            renderPanel('oiContainer', tabData.oi, CONFIG.oiHotThreshold);
            renderPanel('volContainer', tabData.intraday, CONFIG.volHotThreshold);
            updateSummary(tabData.intraday, tabData.oi);
        }

        // ========== REFRESH ==========
        async function refreshData() {
            const btn = document.querySelector('.refresh-btn');
            btn.textContent = '⟳ Loading...';
            btn.disabled = true;
            await fetchTabData(state.activeTab);
            renderActiveTab();
            btn.textContent = '⟳ Refresh';
            btn.disabled = false;
        }

        // ========== INIT ==========
        async function init() {
            // Fetch current tab data
            await fetchTabData('current');

            // Update tab DTE
            const curData = state.data.current?.oi || state.data.current?.intraday;
            if (curData) {
                document.getElementById('tabDteCurrent').textContent = `(${curData.dte.toFixed(1)}d)`;
            }

            renderActiveTab();
            document.getElementById('loading').classList.add('hidden');
            state.refreshTimer = setInterval(refreshData, CONFIG.refreshIntervalMs);
        }
        init();
    </script>
</body>

</html>
