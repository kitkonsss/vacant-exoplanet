name: Deploy SvelteKit Dashboard to Pages

on:
  push:
    branches: [main]
    paths:
      - 'web/src/**'
      - 'web/static/**'
      - 'web/scripts/**'
      - 'web/package.json'
      - 'web/package-lock.json'
      - 'web/jsconfig.json'
      - 'web/postcss.config.js'
      - 'web/svelte.config.js'
      - 'web/tailwind.config.js'
      - 'web/vite.config.js'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Build
        working-directory: web
        env:
          NODE_ENV: production
          # Legacy GitHub Pages serves at the /vacant-exoplanet/ subpath. The
          # default build (Cloudflare Pages) uses base '' for the domain root.
          PAGES_BASE: /vacant-exoplanet
        run: npm run build

      - name: Sync exported site to repo root
        working-directory: web
        run: node scripts/sync-pages-root.mjs

      - name: Commit exported site
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          branch="${GITHUB_REF_NAME:-main}"

          if git diff --quiet -- index.html 404.html favicon.svg .nojekyll _app web/dist/index.html; then
            echo "Repo-root Pages export is already up to date"
          else
            git add index.html 404.html favicon.svg .nojekyll _app web/dist/index.html
            git commit -m "Sync Pages export [skip ci]"
            git pull --rebase origin "$branch"
            git push origin HEAD:"$branch"
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
