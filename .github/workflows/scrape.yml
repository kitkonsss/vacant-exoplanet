name: Scrape QuikStrike Data

on:
  # Triggered by cron-job.org (on schedule) + manual trigger
  # GitHub schedule removed to avoid double-billing of Actions minutes
  #
  # Two modes (omitted input defaults to full):
  #   full     — everything: Intraday + OI views, heatmap/gamma phase. Run a
  #              few times a day (OI/heatmaps only change once per CME day).
  #   intraday — light: only the Intraday Volume view per contract (the one
  #              dataset that moves all day). Safe to run every 10 min.
  #              cron-job.org body: {"ref":"main","inputs":{"mode":"intraday"}}
  workflow_dispatch:
    inputs:
      mode:
        description: 'Scrape mode'
        type: choice
        options: [full, intraday]
        default: full

jobs:
  scrape:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up Chrome
      uses: browser-actions/setup-chrome@latest

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r scraper/requirements.txt

    - name: Run Scraper
      env:
        CME_EMAIL: ${{ secrets.CME_EMAIL }}
        CME_PASSWORD: ${{ secrets.CME_PASSWORD }}
      run: |
        # Run from the scraper directory so relative paths work
        cd scraper
        python quikstrike_scraper.py ${{ inputs.mode == 'intraday' && '--intraday-only' || '' }}

    - name: Snapshot heatmap history
      # Archive a date-stamped copy of the OI + vol2vol (gamma) heatmaps and append
      # the per-day backtest record, so we can later check whether price reached the
      # walls. Resolves data/ from its own path, so no `cd` needed. Never hard-fails.
      # Light runs don't touch heatmaps, so there is nothing new to snapshot.
      if: inputs.mode != 'intraday'
      run: python scraper/snapshot_history.py || true

    - name: Compute Expected Range from IV smile
      # Phase 1: ATM IV / SD bands / term structure / skew from the *_OIData.txt
      # just scraped above (stdlib only, no extra navigation).
      run: python scraper/expected_range_fetch.py || true

    - name: Wall backtest on accumulated history
      # Replays historical OI walls (heatmap matrices + dated snapshots) vs
      # what price actually did — touch/respect/magnet rates with Wilson CIs.
      # Full mode only; the inputs are daily-resolution.
      if: inputs.mode != 'intraday'
      run: python scraper/backtest_walls.py || true

    - name: Analyze intraday option flow
      # Phase 2a: snapshot the intraday volumes just scraped and difference
      # against the rolling history -> data/option_flow.json (flow velocity,
      # magnet, wall attack/defense). Runs in BOTH modes - light runs are the
      # whole point (10-min flow resolution).
      run: python scraper/flow_analyze.py || true

    - name: Rebuild daily strategy with fresh positioning
      # Refresh levels immediately after the scrape so the price watcher acts on
      # current walls instead of waiting for the next macro.yml cycle.
      run: python scraper/strategy_fetch.py --asset all || true

    - name: Commit and push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        branch="${GITHUB_REF_NAME:-main}"

        # Check for any changes in data/ — use porcelain so NEW snapshot files
        # (untracked) are detected too, not just modifications to tracked files.
        if [ -z "$(git status --porcelain data/)" ]; then
          echo "No changes to commit in data/"
        else
          git add data/
          git commit -m "Auto-update QuikStrike data [skip ci]"
          # Full mode runs ~5 min and rewrites every generated file, so a
          # concurrent intraday scrape / price-watcher / macro push almost
          # always lands on origin mid-run. Retry the pull+push and resolve
          # conflicts on the generated JSON with -X theirs (keep OUR freshly
          # scraped data); abort the half-finished rebase between attempts so
          # the next pull starts clean. Same pattern as morning-brief.yml.
          for i in 1 2 3 4 5; do
            if git pull --rebase -X theirs origin "$branch" && git push origin HEAD:"$branch"; then
              echo "pushed on attempt $i"
              exit 0
            fi
            echo "push race (attempt $i) — retrying"
            git rebase --abort 2>/dev/null || true
            sleep 7
          done
          exit 1
        fi

    - name: Telegram alert on failure
      # The scraper is the system's single point of failure (CME UI changes,
      # login issues) — fail loudly instead of silently serving stale data.
      if: failure()
      env:
        TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        [ -n "$TG_TOKEN" ] && curl -s -X POST "https://api.telegram.org/bot$TG_TOKEN/sendMessage" \
          -d chat_id="$TG_CHAT" \
          --data-urlencode "text=🛑 Scrape QuikStrike พัง (mode=${{ inputs.mode || 'full' }}) — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" > /dev/null || true
