name: Scrape QuikStrike Data

on:
  schedule:
    # Normal: every 30 min, 12:00-18:30 & 22:00 ICT (05-11,15 UTC), Mon-Fri
    - cron: '0,30 5-11,15 * * 1-5'
    # Peak (US Open): every 10 min, 19:00-21:50 ICT (12-14 UTC), Mon-Fri
    - cron: '*/10 12-14 * * 1-5'
  # Allow manual trigger
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r scraper/requirements.txt
        # Install Chrome for Selenium
        sudo apt-get update
        sudo apt-get install -y google-chrome-stable

    - name: Run Scraper
      env:
        CME_EMAIL: ${{ secrets.CME_EMAIL }}
        CME_PASSWORD: ${{ secrets.CME_PASSWORD }}
      run: |
        # Run from the scraper directory so relative paths work
        cd scraper
        python quikstrike_scraper.py

    - name: Commit and push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        # Check if there are any changes in the data directory
        if git diff --quiet data/; then
          echo "No changes to commit in data/"
        else
          git add data/
          git commit -m "Auto-update QuikStrike data [skip ci]"
          git push
        fi
