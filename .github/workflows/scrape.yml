name: Scrape QuikStrike Data

on:
  # Triggered by cron-job.org (on schedule) + manual trigger
  # GitHub schedule removed to avoid double-billing of Actions minutes
  #
  # Two modes (omitted input defaults to full):
  #   full     — everything: Intraday + OI views, heatmap/gamma phase. Run a
  #              few times a day (OI/heatmaps only change once per CME day).
  #   intraday — light: only the Intraday Volume view per contract (the one
  #              dataset that moves all day).
  #              cron-job.org body: {"ref":"main","inputs":{"mode":"intraday"}}
  #
  # ⚠ FREQUENCY: while CME's Akamai is flagging the runner IP, hammering it
  # every 10 min worsens the IP reputation. Until the egress fix (WARP below /
  # residential proxy) is confirmed stable, set the cron-job.org interval to
  # ~30-60 min for intraday and a few times/day for full. (Interval lives in
  # cron-job.org, not here — this repo only exposes the manual dispatch.)
  workflow_dispatch:
    inputs:
      mode:
        description: 'Scrape mode'
        type: choice
        options: [full, intraday]
        default: full

jobs:
  scrape:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up Chrome
      uses: browser-actions/setup-chrome@latest

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r scraper/requirements.txt

    - name: Set up Cloudflare WARP (free egress IP via SOCKS proxy)
      # CME's Akamai edge flags the runner's Azure datacenter IP and serves a
      # reCAPTCHA bot-gate instead of the SSO login form. WARP (free, no account)
      # in proxy mode exposes a SOCKS5 proxy on 127.0.0.1:40000 that egresses via
      # Cloudflare. We point ONLY Chrome at it (QS_PROXY) — git/pip/GitHub API
      # stay on the normal network. If WARP fails to come up the scraper still
      # runs direct (and fast-fails on the gate) rather than erroring here.
      continue-on-error: true
      run: |
        set -x
        keyring=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
        repo_codename="$(lsb_release -cs)"

        if ! curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg -o /tmp/cloudflare-warp-pubkey.gpg; then
          echo "::warning::Could not download Cloudflare WARP package key; scraper runs on the direct datacenter IP"
          exit 0
        fi
        if ! sudo gpg --yes --dearmor -o "$keyring" /tmp/cloudflare-warp-pubkey.gpg; then
          echo "::warning::Could not install Cloudflare WARP package key; scraper runs on the direct datacenter IP"
          exit 0
        fi
        echo "deb [signed-by=$keyring] https://pkg.cloudflareclient.com/ $repo_codename main" \
          | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
        if ! sudo apt-get update -qq || ! sudo apt-get install -y cloudflare-warp; then
          echo "::warning::Could not install Cloudflare WARP package; scraper runs on the direct datacenter IP"
          exit 0
        fi
        sudo systemctl enable --now warp-svc || sudo nohup warp-svc >/tmp/warp-svc.log 2>&1 &
        sleep 5
        # Register on the free tier (command name varies by warp-cli version)
        sudo warp-cli --accept-tos registration new 2>/dev/null \
          || sudo warp-cli --accept-tos register 2>/dev/null || true
        sudo warp-cli --accept-tos mode proxy || true
        sudo warp-cli --accept-tos connect || true
        # Wait until the SOCKS proxy reports warp=on (remote DNS via --socks5-hostname)
        ok=""
        for i in $(seq 1 20); do
          if curl -s --max-time 5 --socks5-hostname 127.0.0.1:40000 \
               https://www.cloudflare.com/cdn-cgi/trace/ | grep -q "warp=on"; then
            ok=1; break
          fi
          sleep 3
        done
        echo "--- egress check ---"
        echo "direct:  $(curl -s --max-time 5 https://www.cloudflare.com/cdn-cgi/trace/ | grep -E '^ip=')"
        echo "viaWARP: $(curl -s --max-time 5 --socks5-hostname 127.0.0.1:40000 https://www.cloudflare.com/cdn-cgi/trace/ | grep -E '^(ip|warp)=' | tr '\n' ' ')"
        if [ -n "$ok" ]; then
          echo "QS_PROXY=socks5://127.0.0.1:40000" >> "$GITHUB_ENV"
          echo "WARP proxy ready — Chrome will egress through Cloudflare"
        else
          echo "::warning::WARP did not come up; scraper runs on the direct datacenter IP"
        fi

    - name: Run Scraper
      env:
        CME_EMAIL: ${{ secrets.CME_EMAIL }}
        CME_PASSWORD: ${{ secrets.CME_PASSWORD }}
        # QS_PROXY is exported into the environment by the WARP step above (via
        # $GITHUB_ENV) only when the proxy verified healthy; unset = direct.
      run: |
        # Run from the scraper directory so relative paths work
        cd scraper
        python quikstrike_scraper.py ${{ inputs.mode == 'intraday' && '--intraday-only' || '' }}

    - name: Snapshot position-bias dashboard
      # Keep one Bangkok-time dashboard snapshot per session slot
      # (morning/afternoon/evening/night). Same-slot reruns replace that slot,
      # giving us P/C persistence history without noisy 5-min duplicates.
      run: python scraper/bias_snapshot.py || true

    - name: Snapshot heatmap history
      # Archive a date-stamped copy of the OI + vol2vol (gamma) heatmaps and append
      # the per-day backtest record, so we can later check whether price reached the
      # walls. Resolves data/ from its own path, so no `cd` needed. Never hard-fails.
      # Light runs don't touch heatmaps, so there is nothing new to snapshot.
      if: inputs.mode != 'intraday'
      run: python scraper/snapshot_history.py || true

    - name: Compute Expected Range from IV smile
      # Phase 1: ATM IV / SD bands / term structure / skew from the *_OIData.txt
      # just scraped above (stdlib only, no extra navigation).
      run: python scraper/expected_range_fetch.py || true

    - name: Wall backtest on accumulated history
      # Replays historical OI walls (heatmap matrices + dated snapshots) vs
      # what price actually did — touch/respect/magnet rates with Wilson CIs.
      # Full mode only; the inputs are daily-resolution.
      if: inputs.mode != 'intraday'
      run: python scraper/backtest_walls.py || true

    - name: Analyze intraday option flow
      # Phase 2a: snapshot the intraday volumes just scraped and difference
      # against the rolling history -> data/option_flow.json (flow velocity,
      # magnet, wall attack/defense). Runs in BOTH modes - light runs are the
      # whole point (10-min flow resolution).
      run: python scraper/flow_analyze.py || true

    - name: Rebuild daily strategy with fresh positioning
      # Refresh levels immediately after the scrape so the price watcher acts on
      # current walls instead of waiting for the next macro.yml cycle.
      run: python scraper/strategy_fetch.py --asset all || true

    - name: Commit and push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        branch="${GITHUB_REF_NAME:-main}"

        # Check for any changes in data/ — use porcelain so NEW snapshot files
        # (untracked) are detected too, not just modifications to tracked files.
        if [ -z "$(git status --porcelain data/)" ]; then
          echo "No changes to commit in data/"
        else
          git add data/
          git commit -m "Auto-update QuikStrike data [skip ci]"
          # Full mode runs ~5 min and rewrites every generated file, so a
          # concurrent intraday scrape / price-watcher / macro push almost
          # always lands on origin mid-run. Retry the pull+push and resolve
          # conflicts on the generated JSON with -X theirs (keep OUR freshly
          # scraped data); abort the half-finished rebase between attempts so
          # the next pull starts clean. Same pattern as morning-brief.yml.
          for i in 1 2 3 4 5; do
            if git pull --rebase -X theirs origin "$branch" && git push origin HEAD:"$branch"; then
              echo "pushed on attempt $i"
              exit 0
            fi
            echo "push race (attempt $i) — retrying"
            git rebase --abort 2>/dev/null || true
            sleep 7
          done
          exit 1
        fi

    - name: Telegram alert on failure
      # The scraper is the system's single point of failure (CME UI changes,
      # login issues) — fail loudly instead of silently serving stale data.
      if: failure()
      env:
        TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        [ -n "$TG_TOKEN" ] && curl -s -X POST "https://api.telegram.org/bot$TG_TOKEN/sendMessage" \
          -d chat_id="$TG_CHAT" \
          --data-urlencode "text=🛑 Scrape QuikStrike พัง (mode=${{ inputs.mode || 'full' }}) — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" > /dev/null || true
