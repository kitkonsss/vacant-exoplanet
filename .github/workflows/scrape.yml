name: Scrape QuikStrike Data

on:
  # Triggered by cron-job.org (on schedule) + manual trigger
  # GitHub schedule removed to avoid double-billing of Actions minutes
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up Chrome
      uses: browser-actions/setup-chrome@latest

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r scraper/requirements.txt

    - name: Run Scraper
      env:
        CME_EMAIL: ${{ secrets.CME_EMAIL }}
        CME_PASSWORD: ${{ secrets.CME_PASSWORD }}
      run: |
        # Run from the scraper directory so relative paths work
        cd scraper
        python quikstrike_scraper.py

    - name: Snapshot heatmap history
      # Archive a date-stamped copy of the OI + vol2vol (gamma) heatmaps and append
      # the per-day backtest record, so we can later check whether price reached the
      # walls. Resolves data/ from its own path, so no `cd` needed. Never hard-fails.
      run: python scraper/snapshot_history.py || true

    - name: Compute Expected Range from IV smile
      # Phase 1: ATM IV / SD bands / term structure / skew from the *_OIData.txt
      # just scraped above (stdlib only, no extra navigation).
      run: python scraper/expected_range_fetch.py || true

    - name: Rebuild daily strategy with fresh positioning
      # Refresh levels immediately after the scrape so the price watcher acts on
      # current walls instead of waiting for the next macro.yml cycle.
      run: python scraper/strategy_fetch.py --asset gc || true

    - name: Commit and push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        branch="${GITHUB_REF_NAME:-main}"

        # Check for any changes in data/ — use porcelain so NEW snapshot files
        # (untracked) are detected too, not just modifications to tracked files.
        if [ -z "$(git status --porcelain data/)" ]; then
          echo "No changes to commit in data/"
        else
          git add data/
          git commit -m "Auto-update QuikStrike data [skip ci]"
          git pull --rebase origin "$branch"
          git push origin HEAD:"$branch"
        fi
