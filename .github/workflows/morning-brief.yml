name: Morning Brief

# 06:00 Thai-morning Telegram summary of the day's GC strategy.
#
# OI only publishes once per CME day (~midday Thai), so there is no fresh OI
# to scrape at dawn. Instead this refreshes everything that DOES move
# overnight (price / macro / VWAP) with the light stdlib fetchers, rebuilds
# the strategy on last night's OI, then sends the brief. expected_range_fetch
# drops tenors whose contracts expired overnight, and the message states the
# OI vintage explicitly.
#
# GitHub cron can lag 10-30 min; for a punctual 06:00 point cron-job.org at
# the workflow_dispatch API instead (same pattern as scrape.yml).

on:
  workflow_dispatch:
    inputs:
      send_message:
        description: 'Also send the Telegram brief (off by default — user opted out)'
        type: boolean
        default: false
  schedule:
    # 22:45 UTC = 05:45 ICT next day, Sun-Thu UTC = Mon-Fri Thai mornings.
    # Scheduled runs only refresh the overnight data (price/macro/VWAP/IV/
    # strategy) so the watcher starts the Thai morning on fresh levels —
    # the Telegram message itself is opt-in via workflow_dispatch.
    - cron: '45 22 * * 0-4'

concurrency:
  group: morning-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install yfinance

    - name: Refresh overnight data (macro / VWAP / IV / strategy)
      run: |
        python scraper/macro_fetch.py || true
        python scraper/vwap_fetch.py || true
        python scraper/expected_range_fetch.py || true
        python scraper/strategy_fetch.py --asset all || true

    - name: Send morning brief
      # Telegram message is opt-in only (user stopped reading it); scheduled
      # runs skip this and just keep the dawn data refresh above.
      if: inputs.send_message == true
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python scraper/morning_brief.py

    - name: Commit refreshed data
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        branch="${GITHUB_REF_NAME:-main}"

        if [ -z "$(git status --porcelain data/)" ]; then
          echo "No data changes to commit"
        else
          # expected_range_fetch + strategy_fetch are multi-asset now — stage
          # every file the refresh writes (GC + NQ), guarded on existence.
          # Anything left unstaged would make `git pull --rebase` abort.
          for f in data/macro.json data/vwap.json \
                   data/expected_range.json data/iv_baseline.json data/daily_strategy.json \
                   data/nq/expected_range.json data/nq/iv_baseline.json data/nq/daily_strategy.json; do
            [ -e "$f" ] && git add "$f"
          done
          git commit -m "Morning brief data refresh [skip ci]" || exit 0
          # the 10-min intraday scrape pushes around the clock — retry to
          # survive push races; -X theirs keeps our freshly generated data
          # if a scrape commit touched the same generated files.
          for i in 1 2 3; do
            if git pull --rebase -X theirs origin "$branch" && git push origin HEAD:"$branch"; then
              exit 0
            fi
            echo "push race (attempt $i) — retrying"
            git rebase --abort 2>/dev/null || true
            sleep 7
          done
          exit 1
        fi

    - name: Telegram alert on failure
      if: failure()
      env:
        TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        [ -n "$TG_TOKEN" ] && curl -s -X POST "https://api.telegram.org/bot$TG_TOKEN/sendMessage" \
          -d chat_id="$TG_CHAT" \
          --data-urlencode "text=🛑 Dawn data refresh พัง (morning-brief.yml — ตัวข้อความเช้าปิดอยู่ ที่พังคือการ refresh ข้อมูลเช้าสำหรับ watcher) — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" > /dev/null || true
