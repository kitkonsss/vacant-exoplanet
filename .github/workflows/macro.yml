name: Fetch Macro + COT

# Phase 0 light data layer: macro drivers (yields / real yields / DXY / VIX) and
# weekly CFTC COT positioning. No Selenium / no CME login / no secrets required —
# all sources are public (FRED CSV, yfinance, CFTC Socrata). Runs fast and cheap,
# independent of the heavy QuikStrike scrape (scrape.yml).
#
# Trigger via cron-job.org (like scrape.yml) to avoid double-billing GitHub's
# scheduler. Suggested cadence:
#   - macro+COT: hourly on trading days (macro moves intraday; COT only weekly,
#     but re-running is a no-op when unchanged thanks to the git-diff guard).

on:
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      # Only yfinance (for fresh DXY/VIX). Everything else is Python stdlib.
      run: |
        python -m pip install --upgrade pip
        pip install yfinance

    - name: Fetch macro
      run: python scraper/macro_fetch.py
      continue-on-error: true

    - name: Fetch COT
      run: python scraper/cot_fetch.py --asset all
      continue-on-error: true

    - name: Compute VWAP + SD bands
      # Reads the committed OHLC_1h.json (from scrape.yml) — proxy VWAP/SD bands.
      run: python scraper/vwap_fetch.py
      continue-on-error: true

    - name: Compute Expected Range from IV smile
      # Phase 1: ATM IV / SD bands / term structure / skew from the committed
      # *_OIData.txt Vol Settle columns (no scraping, stdlib only).
      run: python scraper/expected_range_fetch.py
      continue-on-error: true

    - name: Build daily strategy
      # Blends the freshly-fetched macro + COT with the latest committed options
      # positioning (position_bias_summary.json from the heavy scrape.yml run).
      run: python scraper/strategy_fetch.py --asset all
      continue-on-error: true

    - name: Score fired signals (Phase 4 self-eval)
      # Resolves open entries in data/signal_log.json against 15m candles ->
      # win/loss/expired + data/signal_scorecard.json win-rate aggregates.
      run: python scraper/signal_eval.py
      continue-on-error: true

    - name: Commit and push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        branch="${GITHUB_REF_NAME:-main}"

        # porcelain so brand-new files (first signal_log/scorecard) count too
        if [ -z "$(git status --porcelain data/)" ]; then
          echo "No changes to commit in data/"
        else
          for f in data/macro.json data/cot.json data/vwap.json data/daily_strategy.json \
                   data/expected_range.json data/signal_log.json data/signal_scorecard.json \
                   data/iv_baseline.json data/nq/cot.json data/nq/daily_strategy.json \
                   data/nq/expected_range.json data/nq/signal_log.json \
                   data/nq/signal_scorecard.json data/nq/iv_baseline.json; do
            [ -e "$f" ] && git add "$f"
          done
          git commit -m "Auto-update macro + COT + VWAP + strategy [skip ci]" || exit 0
          git pull --rebase origin "$branch"
          git push origin HEAD:"$branch"
        fi

    - name: Telegram alert on failure
      if: failure()
      env:
        TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        [ -n "$TG_TOKEN" ] && curl -s -X POST "https://api.telegram.org/bot$TG_TOKEN/sendMessage" \
          -d chat_id="$TG_CHAT" \
          --data-urlencode "text=🛑 Macro/COT/Strategy pipeline พัง — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" > /dev/null || true
