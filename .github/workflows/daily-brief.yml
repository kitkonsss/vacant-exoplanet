name: Daily Strategy Brief (LLM)

# Phase 3 the subscription way — runs the LLM narrative brief in GitHub Actions
# instead of a claude.ai routine, because:
#   - Actions has repo WRITE access via GITHUB_TOKEN (the routine sandbox's token
#     is read-only -> git push 403), so commits actually land on main.
#   - Actions runners are NOT network-blocked, so the FRED/CFTC fetchers work
#     (they returned 403 inside the routine sandbox).
#   - Uses CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`) = the Claude
#     SUBSCRIPTION, so NO Anthropic API key is required.
#
# One-time setup by the user:
#   1. Run locally:  claude setup-token   (copy the token it prints)
#   2. Repo -> Settings -> Secrets and variables -> Actions -> New repository secret
#        Name:  CLAUDE_CODE_OAUTH_TOKEN
#        Value: <the token>
#   3. Trigger via cron-job.org (like scrape.yml / macro.yml) or the Actions tab.
#      Suggested: weekday mornings ~07:00 Asia/Bangkok (00:00 UTC).
#
# If the secret is absent the brief step is skipped (the deterministic
# daily_strategy.json from macro.yml still updates), so this never hard-fails.

on:
  workflow_dispatch:

jobs:
  brief:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write   # required by anthropics/claude-code-action (OIDC token)
    env:
      # job-level so it can be read in step `if:` (a step can't read its own env)
      HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance

      # Refresh the data layer first (works here — no sandbox 403).
      - name: Refresh macro / COT / strategy
        run: |
          python scraper/macro_fetch.py || true
          python scraper/cot_fetch.py --asset all || true
          python scraper/vwap_fetch.py || true
          python scraper/strategy_fetch.py --asset all || true

      - name: Generate narrative brief
        if: ${{ env.HAS_TOKEN == 'true' }}
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: '--model claude-sonnet-4-6 --allowedTools "Read,Write,WebSearch" --max-turns 40'
          prompt: |
            คุณเป็นนักกลยุทธ์ options/macro futures ของโปรเจกต์ Vol2Vol (ทอง GC).
            ข้อมูลถูกรีเฟรชแล้วใน data/. หน้าที่: อ่านไฟล์แล้วเขียนทับ data/daily_brief.md เป็นภาษาไทย
            (ศัพท์เทคนิค/ระดับราคาเป็นอังกฤษ-ตัวเลข). อย่า git commit/push — workflow จะ commit เอง.

            อ่าน (ใช้ Read เท่านั้น อย่าเดาตัวเลข):
            - ทอง: data/daily_strategy.json, data/macro.json, data/cot.json, data/vwap.json, data/position_bias_summary.json
            - daily_strategy.json field สำคัญ: regime, expected_range, vwap, heatmap_contract_flow, gamma_1pct,
              vol2vol_walls, confluence_levels, contrarian_flag, execution_read
            - regime: trending → เน้นโหมดตามเทรนด์ (momentum); range → เน้นโหมดสวนที่ VWAP ±2/3SD + walls (mean-reversion)
            - expected_range: ATR รายวัน — กำแพงที่อยู่ไกลเกิน ±ATR จากราคา มักไปไม่ถึงในวันเดียว ใช้คัดเป้าที่สมจริง
            - vwap: VWAP ±1/2/3 SD (mean-reversion fade zones) + price_vs_band บอกว่าราคายืดไปทางไหนแล้ว
            - COT v2 (cot.json): producer = hedge เชิงกล (ไม่ใช่ทิศทาง); smart_money = commercials อ่านจาก "การเปลี่ยนแปลง" net
              (z-score) ไม่ใช่ net ดิบ; managed_money มี momentum_signal + contrarian_signal (crowded long/short) +
              pct_rank_label — อย่าตีความ crowded เป็นทิศทางตรงๆ ให้มองเป็นความเสี่ยงสวน
            - heatmap_contract_flow: ดู oi_type/wall_role ของแต่ละ build (call=แนวต้านโต, put=แนวรับโต) + magnet=กองที่ใหญ่สุด;
              อย่าตีความ "OI เพิ่มเหนือราคา = bullish" ตรงๆ — call build เหนือราคา = เพดาน/ต้าน
            - gamma_1pct: แยก nearest wall (speed bump แรก) vs major wall (กำแพงจริงจาก gamma ใหญ่) +
              upside_room_to_major/downside_room_to_major = ระยะที่ราคาน่าจะวิ่งไปต่อได้; gamma_magnet = จุดที่ราคาถูกตรึง
            - confluence_levels: เลเวลที่ ≥2 แหล่ง (OI wall/gamma/round number/fresh build) ทับกัน = จุดน้ำหนักสูงสุด
              อ้างเลเวลพวกนี้เป็นหลัก (ระบุ ×N + sources) แทนการหยิบกำแพงเดี่ยวๆ

            ถ้ามี WebSearch: ค้นข่าว/แคตาลิสต์ที่ขับทองสัปดาห์นี้ + ปฏิทินเศรษฐกิจสหรัฐ
            (FOMC/CPI/PCE/NFP/ISM) แยกหัวข้อละ 1 ครั้ง อย่าใส่วันที่เอง. ถ้าไม่มีให้ข้าม.

            เขียน data/daily_brief.md สำหรับ GC: บรรทัดสรุป 1 ประโยค (ทิศ+ความมั่นใจ+regime+แก่นเหตุผล);
            เหตุผล 3 ชั้น positioning vs macro vs COT (ชั้นไหนหนุน/สวน + ตัวเลขจริง เช่น real yield, smart_money z-score,
            MM momentum/contrarian, call/put wall);
            แยกแผนเป็น 2 โหมดตาม regime: "📈 โหมดตามเทรนด์ (Momentum)" และ "🔄 โหมดสวน (Mean-reversion @ VWAP ±2/3SD + walls)"
            — ระบุ regime ว่าโหมดไหนนำ;
            เพิ่มหัวข้อ "Execution read" ที่ตอบ: contract เพิ่มตรงไหน+เป็น call(ต้าน)/put(รับ) จาก heatmap,
            ราคาวิ่งต่อได้ถึงไหน (gamma first wall = speed bump, major wall + room_to_major = เป้าจริง),
            magnet (OI + gamma) อยู่ตรงไหน, และ confluence_levels ที่ ≥2 แหล่งทับกันคือจุดไหน (อ้าง ×N);
            Key levels (resistance/magnet/support จาก key_levels);
            Scenarios ขึ้น/ลง (trigger → then → invalidation);
            อะไรจะเปลี่ยนมุมมอง; ข้อควรระวัง. ปิดท้ายด้วยหัวข้อ "## 📰 ข่าว & แคตาลิสต์สัปดาห์นี้" (ถ้าค้นข่าวได้)
            และ disclaimer 1 บรรทัด (เชิงการศึกษา ไม่ใช่คำแนะนำลงทุน ไม่มีคำสั่ง entry/stop/target จริง).
            ใส่วันที่จาก generated_at ของ daily_strategy.json บนหัวไฟล์. ต้องเขียนไฟล์จริงให้เสร็จ.

      - name: Commit and push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          branch="${GITHUB_REF_NAME:-main}"
          # claude-code-action clears the checkout's persisted credential, so
          # re-arm push auth with the Actions token explicitly in the remote URL.
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          if git diff --quiet data/; then
            echo "No data changes to commit"
          else
            git add data/macro.json data/cot.json data/vwap.json \
                    data/daily_strategy.json \
                    data/daily_brief.md
            git commit -m "Daily brief + data refresh [skip ci]"
            git pull --rebase origin "$branch"
            git push origin HEAD:"$branch"
          fi
