name: Price Watcher

# Entry-signal watcher: pulls the live GC price (yfinance) and compares it to
# the setups already computed in data/daily_strategy.json (breakout triggers,
# mean-reversion zones, confluence levels). Sends Telegram alerts via
# scraper/price_watcher.py.
#
# Cadence: the `schedule` cron below is the free backup (GitHub may delay it
# 10-30 min). For tighter timing, point cron-job.org at the workflow_dispatch
# API every 5 min, same as scrape.yml / macro.yml:
#   POST https://api.github.com/repos/<owner>/<repo>/actions/workflows/price-watcher.yml/dispatches
#   body: {"ref":"main"}
#
# Required repo secrets: TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID.
# Without them the run still works but only prints alerts to the log.

on:
  workflow_dispatch:
    inputs:
      test_message:
        description: 'Send a Telegram connectivity test message'
        type: boolean
        default: false
  schedule:
    - cron: '*/15 * * * 0-5'   # every 15 min, Sun-Fri (GC is closed Saturday)

concurrency:
  group: price-watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install yfinance

    - name: Run price watcher
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python scraper/price_watcher.py ${{ inputs.test_message && '--test-message' || '' }}

    - name: Commit watcher state + signal log
      # Persists alert-dedupe state and the Phase-4 signal log (input for
      # signal_eval.py scoring, which runs hourly in macro.yml).
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        branch="${GITHUB_REF_NAME:-main}"

        if [ -z "$(git status --porcelain data/watcher_state.json data/signal_log.json)" ]; then
          echo "No state changes to commit"
        else
          # signal_log.json doesn't exist until the first alert fires —
          # git add on a missing pathspec is fatal, so add only what exists.
          for f in data/watcher_state.json data/signal_log.json; do
            [ -e "$f" ] && git add "$f"
          done
          git commit -m "Update price watcher state [skip ci]" || exit 0
          # The watcher runs every few minutes alongside other pushing
          # workflows — retry the pull+push to survive push races.
          for i in 1 2 3; do
            if git pull --rebase origin "$branch" && git push origin HEAD:"$branch"; then
              exit 0
            fi
            echo "push race (attempt $i) — retrying"
            sleep 7
          done
          exit 1
        fi

    - name: Telegram alert on failure
      if: failure()
      env:
        TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        [ -n "$TG_TOKEN" ] && curl -s -X POST "https://api.telegram.org/bot$TG_TOKEN/sendMessage" \
          -d chat_id="$TG_CHAT" \
          --data-urlencode "text=🛑 Price Watcher พัง — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" > /dev/null || true
